<!DOCTYPE html>
<!--
  FullStatus Student · App del alumno
  Propiedad intelectual de PRISMAL MESH. Todos los derechos reservados.

  CAMBIO (10/oct/2026): nuevo flujo de pantallas. Primero se entra con la matrícula;
  luego hay una pantalla de inicio con matrícula, nombre y grupo del alumno y los
  botones Exámenes / Asistencias. La vigilancia anti-trampa empieza solo al pulsar
  "Comenzar examen".

  CAMBIO (10/oct/2026, 2): la pantalla "Asistencias" ya muestra datos reales. Llama a la
  función RPC consultar_asistencias de Supabase (que valida la matrícula en el servidor y
  solo devuelve las asistencias de ESA matrícula) y muestra, por materia, los totales y el
  detalle por fecha. Es una pantalla fuera del examen: no toca la vigilancia anti-trampa.

  CAMBIO (10/oct/2026, 3): el menú se reorganiza por MATERIA → UNIDAD → (resumen + examen).
    1) Inicio: debajo de "¿Qué quieres hacer?" solo hay un botón por materia (p. ej. INGLÉS I).
       Ya no existen los botones "Exámenes" y "Asistencias" ni la pantalla suelta de asistencias.
    2) Al entrar a una materia salen sus unidades (UNIDAD 1, UNIDAD 2...). Las unidades se
       sacan de preguntas.seccion: toda sección cuyo texto contenga "Unidad N" (p. ej.
       "Unidad 1 - Present Simple") pertenece a la UNIDAD N. Sin tabla nueva.
    3) Dentro de la unidad: resumen de asistencias/faltas y el botón del examen de la unidad.
       El resumen por unidad usa las fechas de la tabla opcional "unidades" (grupo, materia,
       nombre, desde, hasta). Si esa tabla no existe o no tiene la unidad, se muestra el resumen
       de toda la materia y se avisa en pantalla (nunca se rompe).
    4) El examen de la unidad solo muestra las preguntas de esa unidad. La calificación sigue
       siendo la de siempre (calificar_examen): se manda un arreglo con UN número por pregunta
       de la materia y las que no son de la unidad van en -1 (cuentan como mala, así que las
       "correctas" que regresa el servidor son solo las de la unidad).

  CAMBIO (12/oct/2026): CONTRASEÑA DEL ALUMNO.
    1) La pantalla de inicio (login) ahora pide matrícula Y contraseña. Se validan en el
       servidor con la función RPC validar_acceso (compara contra un hash bcrypt; la
       contraseña nunca se guarda ni se devuelve en claro).
    2) Debajo del botón Entrar hay un enlace "Crear contraseña" que lleva a otra ventana donde
       el alumno elige su contraseña UNA sola vez (función RPC crear_contrasena) y la guarda.
       Al guardar vuelve al acceso (con la matrícula ya escrita) para entrar con matrícula y
       contraseña. Si ya tiene una, solo el profesor puede restablecerla
       (función restablecer_contrasena, desde el panel de administrador).
       En ambas ventanas, una matrícula que no existe muestra "Matrícula no registrada...".
    3) Tras 5 contraseñas incorrectas seguidas, el servidor bloquea la matrícula 10 minutos.
    4) La contraseña se lee del campo, se manda y el campo se vacía: no se guarda en variables
       globales. buscarAlumno()/validar_matricula ya no se usan desde esta pantalla.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullStatus Student</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { margin: 0; padding: 16px; font-family: sans-serif; background: #f5f5f5; color: #222; }
  h1 { font-size: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; }
  button { width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; border: 0; border-radius: 10px; background: #1565c0; color: #fff; }
  button.op { background: #fff; color: #222; border: 2px solid #ccc; text-align: left; }
  button.op.sel { border-color: #1565c0; background: #e3f2fd; }
  /* Botón secundario (p. ej. "Sección anterior", "Crear contraseña"). */
  button.sec { background: #fff; color: #1565c0; border: 2px solid #1565c0; }
  button:disabled { opacity: .4; }
  input { width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; border: 2px solid #ccc; border-radius: 10px; -webkit-user-select: text; user-select: text; }
  /* Etiqueta pequeña sobre un campo de texto (login y crear contraseña). */
  .campo-etq { font-size: 13px; color: #555; margin: 12px 0 0; }
  .aviso { font-size: 14px; color: #b71c1c; }
  /* Mensaje de éxito (p. ej. "Contraseña creada") en verde. */
  .ok { font-size: 14px; color: #2e7d32; font-weight: 600; }
  /* Botón con aspecto de enlace (texto subrayado, sin caja): "Crear contraseña" en el login. */
  button.enlace { background: none; color: #1565c0; text-decoration: underline; width: auto; display: block; margin: 4px auto 0; padding: 8px; font-size: 16px; }
  /* Pasa el texto a mayúsculas solo al mostrarlo (INGLÉS I, UNIDAD 1) sin cambiar el dato original. */
  .mayus { text-transform: uppercase; }
  /* Etiqueta de sección (p. ej. "Unidad 1 - Present Simple"): agrupa/organiza
     preguntas de una misma materia. Es solo texto libre en preguntas.seccion —
     no es una tabla aparte ni afecta la calificación. Ahora la sección es la
     pantalla completa: todas sus preguntas se muestran juntas debajo de ella. */
  .seccion-label {
    font-size: 13px; font-weight: 700; color: #1565c0; text-transform: uppercase;
    letter-spacing: .3px; margin: -4px 0 8px;
  }
  /* Cada pregunta dentro de la pantalla de sección va separada por una línea. */
  .pregunta-bloque { padding: 14px 0; border-top: 1px solid #e0e0e0; }
  .pregunta-bloque:first-of-type { border-top: 0; }
  .pregunta-bloque h2 { font-size: 17px; margin: 0 0 4px; }
  /* --- Reloj del examen ---
     Barra fija arriba, FUERA de #app, para que siga visible y no se borre cuando
     se cambia de sección (pantalla() solo reemplaza el contenido de #app). */
  #reloj {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10; text-align: center;
    padding: 6px 8px; background: #1565c0; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  #reloj .reloj-tiempo { font-size: 18px; font-weight: 700; }
  /* Encabezado del examen: nombre, matrícula y grupo del alumno que accedió. */
  #reloj .reloj-alumno { font-size: 12px; font-weight: 400; margin-top: 2px; }
  /* Últimos 5 minutos: se pone rojo para avisar al alumno. */
  #reloj.poco { background: #b71c1c; }
  body.con-reloj { padding-top: 76px; }
  /* --- Contexto por pregunta (video embebido o texto de apoyo/lectura) ---
     El video SIEMPRE va embebido (iframe), nunca como link externo: un link
     que abra YouTube fuera de la app cancelaría el examen (ver anularExamen()
     en MainActivity.java — onPause()/onWindowFocusChanged() cierran la app si
     pierde el foco). */
  .video-envoltorio {
    position: relative; width: 100%; padding-bottom: 56.25%; height: 0;
    margin-bottom: 12px; border-radius: 8px; overflow: hidden; background: #000;
  }
  .video-envoltorio iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .contexto-texto {
    background: #eef4fb; border-left: 4px solid #1565c0; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.4;
    white-space: pre-wrap; -webkit-user-select: text; user-select: text;
  }
  /* Mensaje que aparece bajo el video cuando el reproductor de YouTube falla
     (ver crearReproductor()). */
  .video-aviso { font-size: 13px; color: #b71c1c; margin: -6px 0 12px; }
  /* --- Pantalla de inicio (después de entrar con la matrícula) ---
     Tarjeta con los datos del alumno y un menú de botones grandes. */
  .perfil { background: #eef4fb; border-radius: 10px; padding: 12px 14px; margin: 12px 0 18px; }
  .perfil-nombre { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  .dato { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #d3e2f4; font-size: 15px; }
  .dato-etq { color: #555; }
  .dato-val { font-weight: 600; text-align: right; }
  .menu-boton { padding: 20px 16px; font-size: 18px; text-align: left; text-transform: uppercase; }
  .info { font-size: 14px; color: #444; }

  /* --- Resumen de asistencias ---
     Totales en una cuadrícula de 2 x 2 y un detalle por fecha que se abre y se
     cierra con un botón. Se usa dentro de la pantalla de cada unidad. */
  .asist-grupo { border-top: 1px solid #e0e0e0; padding-top: 14px; margin-top: 14px; }
  .asist-grupo:first-of-type { border-top: 0; margin-top: 6px; padding-top: 0; }
  .asist-grupo h2 { font-size: 18px; margin: 0 0 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .stat { background: #f1f5fb; border-radius: 10px; padding: 10px 6px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stat-etq { font-size: 12px; color: #555; margin-top: 2px; }
  .s-p { color: #2e7d32; } .s-j { color: #1565c0; } .s-a { color: #c62828; } .s-r { color: #ef6c00; }
  .eq { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
  .detalle-lista { margin-top: 6px; }
  .detalle-fila { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 9px 0; border-top: 1px solid #e0e0e0; font-size: 14px; }
  .detalle-nota { font-size: 12px; color: #555; margin-top: 2px; }
  .badge { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap; }
  .b-p { background: #2e7d32; } .b-r { background: #ef6c00; } .b-a { background: #c62828; } .b-j { background: #1565c0; }
</style>

<body>
<div id="app"></div>
<script>
// ---- Conexión con Supabase ----
// La clave "anon"/"publishable" está pensada para ir en el cliente: por sí sola
// no permite hacer nada que las políticas de RLS en la base de datos no permitan
// (aquí: leer solo preguntas activas, e insertar resultados, nada más).
var SUPABASE_URL = "https://juvqvshcfsrtscvzluaa.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1dnF2c2hjZnNydHNjdnpsdWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDY4NjQsImV4cCI6MjEwNTg4Mjg2NH0.aL2bzJbTJ6DfzUlh8UaSBZ5Fah3Bae1tNBDi7R6BD68";

// ---- Acceso con matrícula + contraseña (en el servidor) ----
// La lista de alumnos y sus contraseñas viven en la tabla "alumnos" de Supabase y el
// rol anon NO puede leerla. Solo puede llamar a estas funciones, que regresan siempre
// un objeto { ok: true|false, ... } (no lanzan error para que el servidor pueda contar
// los intentos fallidos):
//   validar_acceso(p_matricula, p_contrasena)  -> { ok, matricula, nombre, grupo }
//                                                 o { ok:false, motivo, minutos? }
//   crear_contrasena(p_matricula, p_contrasena) -> igual; solo funciona si aún no tiene.
// motivo: no_registrada | sin_contrasena | incorrecta | bloqueado | ya_tiene | invalida
function llamarAcceso(funcion, matricula, contrasena) {
  var m = String(matricula || "").replace(/\s+/g, "");
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + funcion, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_matricula: m, p_contrasena: String(contrasena || "") })
  }).then(function (resp) {
    if (resp.ok) return resp.json();
    return resp.text().then(function (t) { throw new Error(t || "No se pudo validar el acceso"); });
  });
}
function iniciarSesion(matricula, contrasena) { return llamarAcceso("validar_acceso", matricula, contrasena); }
function crearContrasena(matricula, contrasena) { return llamarAcceso("crear_contrasena", matricula, contrasena); }

// Texto para el alumno según el "motivo" que regresa el servidor.
function mensajeAcceso(r) {
  if (r.motivo === "no_registrada") return "Matrícula no registrada";
  if (r.motivo === "sin_contrasena") return "Esta matrícula aún no tiene contraseña. Toca «Crear contraseña».";
  if (r.motivo === "incorrecta") return "Matrícula o contraseña incorrecta.";
  if (r.motivo === "bloqueado") return "Demasiados intentos fallidos. Espera " + (r.minutos || 10) + " minuto(s) e inténtalo de nuevo.";
  if (r.motivo === "ya_tiene") return "Esta matrícula ya tiene contraseña. Regresa al acceso y entra con ella; si la olvidaste, pide a tu profesor que la restablezca.";
  if (r.motivo === "invalida") return "La contraseña debe tener al menos 6 caracteres.";
  return "No se pudo continuar. Inténtalo de nuevo.";
}

// ---- Consulta de asistencias (en el servidor) ----
// La tabla "asistencias" tiene RLS cerrada: el rol anon NO puede leerla directo.
// Solo puede llamar a consultar_asistencias, que vuelve a validar la matrícula en el
// servidor y devuelve únicamente las asistencias de ESA matrícula. Así la lista
// completa de asistencias nunca viaja a la app (misma idea que validar_matricula).
// Regresa una promesa con un arreglo, uno por materia/grupo:
//   [{ grupo, materia, asistencias, justificadas, faltas, retardos,
//      faltas_equivalentes, detalle: [{ fecha, estado, justificada, nota }] }]
function consultarAsistencias(matricula) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/consultar_asistencias", {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_matricula: String(matricula || "") })
  }).then(function (resp) {
    if (resp.ok) return resp.json();
    return resp.text().then(function (t) { throw new Error(t || "No se pudieron cargar las asistencias"); });
  });
}

// ---- Fechas de cada unidad (tabla opcional "unidades") ----
// Sirve para separar las asistencias por unidad: cada fila dice de qué fecha a qué
// fecha va una unidad de un grupo y materia. La tabla es OPCIONAL: si no existe, si
// el rol anon no puede leerla o si hay un fallo de red, se regresa [] y la pantalla
// de la unidad muestra el resumen de toda la materia en lugar de romperse.
// Regresa una promesa con [{ nombre, desde, hasta }] (fechas "AAAA-MM-DD").
function cargarRangosUnidades(grupo, materia) {
  var url = SUPABASE_URL + "/rest/v1/unidades?select=nombre,desde,hasta" +
    "&grupo=eq." + encodeURIComponent(grupo) + "&materia=eq." + encodeURIComponent(materia);
  return fetch(url, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
  }).then(function (resp) {
    return resp.ok ? resp.json() : [];
  }).catch(function () { return []; });
}

// Duración total del examen, en minutos. Cámbiala aquí si hace falta.
var DURACION_MIN = 60;

function cargarMaterias() {
  var url = SUPABASE_URL + "/rest/v1/materias?select=id,nombre&activa=eq.true&order=orden.asc";
  return fetch(url, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
  }).then(function (resp) {
    if (!resp.ok) throw new Error("No se pudieron cargar las materias");
    return resp.json();
  });
}

function cargarPreguntas(materiaId) {
  // Ya NO se pide la respuesta correcta aquí — el servidor no la entrega a este
  // rol (anon). La calificación se hace del lado seguro, ver calificarExamen().
  // "seccion" es la etiqueta opcional de agrupación (ver comentario de
  // .seccion-label arriba) y también de ella se sacan las unidades.
  var url = SUPABASE_URL + "/rest/v1/preguntas?select=texto,opciones,contexto,seccion&activa=eq.true&materia_id=eq." + materiaId + "&order=orden.asc";
  return fetch(url, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY
    }
  }).then(function (resp) {
    if (!resp.ok) throw new Error("No se pudieron cargar las preguntas");
    return resp.json();
  }).then(function (filas) {
    return filas.map(function (f) { return { t: f.texto, o: f.opciones, x: f.contexto || null, s: f.seccion || null }; });
  });
}

// La calificación se calcula en el servidor (función calificar_examen), que es
// la única que puede leer cuál era la opción correcta. El cliente nunca la ve,
// ni antes ni después: solo recibe el resultado ya calculado.
function calificarExamen(materiaId, matricula, respuestas) {
  var url = SUPABASE_URL + "/rest/v1/rpc/calificar_examen";
  return fetch(url, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_materia_id: materiaId, p_matricula: matricula, p_respuestas: respuestas })
  }).then(function (resp) {
    if (!resp.ok) return resp.text().then(function (t) { throw new Error(t || "No se pudo calificar el examen"); });
    return resp.json();
  });
}

// Busca un link de YouTube (youtube.com/watch?v=, youtu.be/, o ya en formato
// /embed/) dentro de un texto libre y regresa solo el ID del video, o null si no
// encuentra ninguno. Se usa para decidir si el "contexto" de una pregunta
// se muestra como video embebido o como bloque de texto plano.
function extraerIdYoutube(texto) {
  if (!texto) return null;
  var m = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/.exec(texto);
  return m ? m[1] : null;
}

// ---- Reproductor de YouTube (API oficial de iframe) ----
// La página se identifica ante YouTube con su origen (parámetro "origin"), que
// es lo que el reproductor exige, y la API avisa el CÓDIGO del error (onError),
// que se muestra bajo el video para saber la causa real.
//
// La API es https://www.youtube.com/iframe_api; al cargar llama a la función global
// onYouTubeIframeAPIReady. Mientras no esté lista, las peticiones de video se
// guardan en ytCola y se ejecutan cuando llegue.
var ytListo = false;
var ytCola = [];
var ytContador = 0; // para dar un id único a cada contenedor de reproductor

window.onYouTubeIframeAPIReady = function () {
  ytListo = true;
  ytCola.forEach(function (f) { f(); });
  ytCola = [];
};

function cargarApiYoutube() {
  if (document.getElementById("yt-api")) return; // ya se pidió
  var s = document.createElement("script");
  s.id = "yt-api";
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}

// Texto para el alumno/profesor según el código de error de YouTube.
function mensajeErrorVideo(codigo) {
  if (codigo === 101 || codigo === 150) return "El dueño del video no permite verlo dentro de otras apps (código " + codigo + "). Avisa a tu profesor.";
  if (codigo === 100) return "El video no existe o es privado (código 100). Avisa a tu profesor.";
  if (codigo === 153) return "YouTube rechazó la configuración del reproductor (código 153). Avisa a tu profesor.";
  if (codigo === 2) return "El enlace del video no es válido (código 2). Avisa a tu profesor.";
  return "No se pudo reproducir el video (código " + codigo + "). Avisa a tu profesor.";
}

// Crea el reproductor dentro de "destino" (un <div> ya presente en la pantalla).
// "aviso" es el elemento donde se escribe el mensaje si algo falla.
function crearReproductor(destino, idVideo, aviso) {
  function iniciar() {
    var vars = { playsinline: 1, rel: 0 };
    // origin = origen de esta página (https://<id de la app>, ver MainActivity.origenBase()).
    // Si el WebView reportara "null" no se manda, para no dar un origen inválido.
    if (window.location.origin && window.location.origin !== "null") vars.origin = window.location.origin;
    new YT.Player(destino, {
      videoId: idVideo, width: "100%", height: "100%", playerVars: vars,
      events: { onError: function (e) { aviso.textContent = mensajeErrorVideo(e.data); } }
    });
  }
  if (ytListo) { iniciar(); return; }
  ytCola.push(iniciar);
  cargarApiYoutube();
  // Si en 8 s la API no llegó (sin internet, bloqueada), se avisa en vez de dejar el cuadro negro.
  setTimeout(function () {
    if (!ytListo) aviso.textContent = "No se pudo cargar el reproductor de YouTube. Revisa tu conexión.";
  }, 8000);
}

// ---- Estado y pantallas ----
var MATERIAS = [];
var materiaId = null;
var PREGUNTAS = [];      // TODAS las preguntas de la materia (el servidor califica por posición en esta lista)
var UNIDAD_IDX = [];     // índices (en PREGUNTAS) de las preguntas de la unidad que se está presentando
var NUMERO = {};         // índice en PREGUNTAS -> número que ve el alumno (1, 2, 3... dentro de la unidad)
var SECCIONES = [];      // grupos de preguntas consecutivas con la misma sección (ver agruparSecciones)
var secIdx = 0;          // sección que se está mostrando
var app = document.getElementById("app");
var alumno = null;       // { matricula, nombre, grupo } del alumno que accedió
var matriculaEscrita = ""; // lo último que escribió en el campo (por si vuelve atrás). La contraseña NO se guarda aquí.
var resp = [];
var avisoFaltantes = false; // true tras avisar de preguntas sin responder (el 2.º toque ya termina)

// ---- Reloj ----
var relojTimer = null;   // id del setInterval, o null si no corre
var relojFin = 0;        // momento (ms desde 1970) en que se acaba el tiempo
var examenTerminado = false; // evita calificar dos veces (p. ej. botón + fin del tiempo a la vez)

document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

function el(tag, texto, clase) {
  var e = document.createElement(tag);
  if (texto) e.textContent = texto;
  if (clase) e.className = clase;
  return e;
}
function pantalla(card) { app.innerHTML = ""; app.appendChild(card); window.scrollTo(0, 0); }

// Formatea milisegundos como mm:ss (o h:mm:ss si hay horas).
function formatoTiempo(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = s % 60;
  function dos(n) { return (n < 10 ? "0" : "") + n; }
  return (h > 0 ? h + ":" : "") + dos(m) + ":" + dos(seg);
}

// Arranca el reloj. Se usa una HORA DE FIN (Date.now() + duración) y no un
// contador que resta 1 cada segundo: así, si el WebView atrasa algún tick, el
// tiempo restante sigue siendo correcto.
function iniciarReloj() {
  var barra = document.getElementById("reloj");
  if (!barra) {
    barra = el("div");
    barra.id = "reloj";
    document.body.appendChild(barra);
  }
  barra.innerHTML = "";
  var lineaTiempo = el("div", "", "reloj-tiempo");
  barra.appendChild(lineaTiempo);
  barra.appendChild(el("div", alumno.nombre + " · " + alumno.matricula + " · Grupo " + alumno.grupo, "reloj-alumno"));
  document.body.classList.add("con-reloj");
  relojFin = Date.now() + DURACION_MIN * 60 * 1000;
  function tick() {
    var restante = relojFin - Date.now();
    lineaTiempo.textContent = "⏱ " + formatoTiempo(restante);
    barra.className = restante <= 5 * 60 * 1000 ? "poco" : "";
    if (restante <= 0) fin(true); // se acabó el tiempo: se entrega lo que haya
  }
  tick();
  relojTimer = setInterval(tick, 1000);
}

// Detiene y quita el reloj de la pantalla.
function detenerReloj() {
  if (relojTimer) { clearInterval(relojTimer); relojTimer = null; }
  var barra = document.getElementById("reloj");
  if (barra) barra.parentNode.removeChild(barra);
  document.body.classList.remove("con-reloj");
}

// ---- Flujo de pantallas (reorganizado el 10/oct/2026, 3; contraseña 12/oct/2026) ----
// 1) pantallaLogin: matrícula + contraseña (se validan en el servidor).
//    1b) pantallaCrearContrasena: el alumno que aún no tiene contraseña la crea (una sola vez).
// 2) pantallaInicio: datos del alumno + un botón por MATERIA.
// 3) pantallaUnidades: las unidades (UNIDAD 1, UNIDAD 2...) de la materia elegida.
// 4) pantallaUnidad: resumen de asistencias de esa unidad + botón del examen.
// 5) confirmarExamen -> examen (pantallaSeccion) -> resultado.
// La vigilancia anti-trampa (Android.iniciarExamen) empieza SOLO en el paso 5, al
// pulsar "Comenzar examen", así que moverse por las pantallas 1 a 4 no anula nada.

// ---- Utilidades de materias y unidades ----

// Normaliza un nombre para compararlo: sin acentos, sin espacios ni signos y en
// minúsculas. Sirve para unir la materia del examen (tabla materias) con la materia
// de las asistencias aunque se hayan escrito un poco distinto ("Inglés I" / "INGLES I").
function clave(texto) {
  return String(texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

// Saca el número de unidad de un texto ("Unidad 1 - Present Simple" -> 1).
// Regresa null si el texto no menciona una unidad. Así se decide a qué unidad
// pertenece cada pregunta (por su sección) y también se unen las fechas de la
// tabla "unidades" con la unidad que se está viendo.
function numeroUnidad(texto) {
  var m = /unidad\s*(\d+)/i.exec(String(texto || ""));
  return m ? parseInt(m[1], 10) : null;
}

// Agrupa las preguntas (ya ordenadas) por unidad. Cada unidad guarda los ÍNDICES en
// PREGUNTAS (no copias), porque el servidor califica por posición en la lista completa.
// Las preguntas cuya sección no menciona una unidad no pertenecen a ninguna y no salen.
// Regresa [{ num, nombre: "Unidad N", indices: [...] }] ordenado por número.
function calcularUnidades(preguntas) {
  var mapa = {};
  preguntas.forEach(function (p, i) {
    var n = numeroUnidad(p.s);
    if (n === null) return;
    if (!mapa[n]) mapa[n] = { num: n, nombre: "Unidad " + n, indices: [] };
    mapa[n].indices.push(i);
  });
  return Object.keys(mapa).map(function (k) { return mapa[k]; }).sort(function (a, b) { return a.num - b.num; });
}

// Busca, en la lista de asistencias del alumno, el registro de una materia por nombre.
function asistenciaDeMateria(lista, nombreMateria) {
  var k = clave(nombreMateria);
  for (var i = 0; i < (lista || []).length; i++) {
    if (clave(lista[i].materia) === k) return lista[i];
  }
  return null;
}

// Recalcula los totales a partir del detalle por fecha (se usa cuando se filtra por
// las fechas de una unidad). Misma regla de siempre: una falta justificada se cuenta
// aparte y 3 retardos = 1 falta equivalente.
function resumenDeDetalle(detalle) {
  var r = { asistencias: 0, justificadas: 0, faltas: 0, retardos: 0, detalle: detalle };
  detalle.forEach(function (d) {
    if (d.estado === "P") r.asistencias++;
    else if (d.estado === "R") r.retardos++;
    else if (d.estado === "A") { if (d.justificada) r.justificadas++; else r.faltas++; }
  });
  r.faltas_equivalentes = r.faltas + Math.floor(r.retardos / 3);
  return r;
}

// Fila "etiqueta ... valor" de la tarjeta de datos del alumno.
function fila(etiqueta, valor) {
  var f = el("div", "", "dato");
  f.appendChild(el("span", etiqueta, "dato-etq"));
  f.appendChild(el("span", valor, "dato-val"));
  return f;
}

// Campo de contraseña: type="password" oculta lo escrito; autocomplete="off" evita que
// el teclado la sugiera/guarde. Se usa en el login y en "Crear contraseña".
function campoContrasena() {
  var inp = el("input");
  inp.type = "password";
  inp.setAttribute("autocomplete", "off");
  return inp;
}

// Pantalla 1: entrar con la matrícula y la contraseña.
// "mensajeOk" (opcional): texto verde que se muestra arriba, p. ej. al volver de crear la contraseña.
function pantallaLogin(mensajeOk) {
  alumno = null;
  var c = el("div", "", "card");
  c.appendChild(el("h1", "FullStatus Student"));
  if (mensajeOk) c.appendChild(el("p", mensajeOk, "ok"));
  c.appendChild(el("p", "Escribe tu matrícula y tu contraseña para entrar:"));

  c.appendChild(el("p", "Matrícula", "campo-etq"));
  var inp = el("input");
  inp.type = "text";
  inp.setAttribute("inputmode", "numeric");
  inp.setAttribute("autocomplete", "off");
  inp.value = matriculaEscrita;
  c.appendChild(inp);

  c.appendChild(el("p", "Contraseña", "campo-etq"));
  var pass = campoContrasena();
  c.appendChild(pass);

  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", "Entrar");
  b.onclick = function () {
    matriculaEscrita = inp.value.trim();
    var contrasena = pass.value;
    if (!matriculaEscrita) { msg.textContent = "Escribe tu matrícula."; return; }
    if (!contrasena) { msg.textContent = "Escribe tu contraseña."; return; }
    inp.blur();
    pass.blur();
    b.disabled = true;
    bCrear.disabled = true;
    b.textContent = "Verificando...";
    msg.textContent = "";
    // La matrícula y la contraseña se validan en el servidor (validar_acceso). El mensaje de
    // rechazo no da pistas de matrículas parecidas.
    iniciarSesion(matriculaEscrita, contrasena).then(function (r) {
      pass.value = ""; // la contraseña no se queda en pantalla ni en memoria
      if (!r || !r.ok) {
        msg.textContent = mensajeAcceso(r || {});
        b.disabled = false;
        bCrear.disabled = false;
        b.textContent = "Entrar";
        return;
      }
      alumno = { matricula: r.matricula, nombre: r.nombre, grupo: r.grupo };
      pantallaInicio();
    }).catch(function () {
      msg.textContent = "No se pudo continuar. Revisa tu conexión e inténtalo de nuevo.";
      b.disabled = false;
      bCrear.disabled = false;
      b.textContent = "Entrar";
    });
  };
  c.appendChild(b);

  // Para el alumno que todavía no tiene contraseña: enlace que lleva a la ventana donde la
  // crea (una sola vez). Después vuelve aquí para entrar con matrícula y contraseña.
  c.appendChild(el("p", "¿Aún no tienes contraseña?", "info"));
  var bCrear = el("button", "Crear contraseña", "enlace");
  bCrear.onclick = function () {
    matriculaEscrita = inp.value.trim();
    pantallaCrearContrasena();
  };
  c.appendChild(bCrear);
  pantalla(c);
}

// Pantalla 1b: crear la contraseña. Solo funciona si la matrícula existe y aún no tiene
// contraseña (el servidor lo comprueba en crear_contrasena). Si el alumno la olvida,
// el profesor la restablece y vuelve a crearla aquí.
function pantallaCrearContrasena() {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Crear contraseña"));
  c.appendChild(el("p", "Elige una contraseña para tu matrícula (mínimo 6 caracteres). Solo puedes crearla una vez; si la olvidas, tu profesor la restablece.", "info"));

  c.appendChild(el("p", "Matrícula", "campo-etq"));
  var inp = el("input");
  inp.type = "text";
  inp.setAttribute("inputmode", "numeric");
  inp.setAttribute("autocomplete", "off");
  inp.value = matriculaEscrita;
  c.appendChild(inp);

  c.appendChild(el("p", "Contraseña", "campo-etq"));
  var pass1 = campoContrasena();
  c.appendChild(pass1);
  c.appendChild(el("p", "Repite la contraseña", "campo-etq"));
  var pass2 = campoContrasena();
  c.appendChild(pass2);

  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", "Guardar contraseña");
  var volver = el("button", "← Volver al acceso", "sec");
  volver.onclick = function () { matriculaEscrita = inp.value.trim(); pantallaLogin(); };
  b.onclick = function () {
    matriculaEscrita = inp.value.trim();
    var p1 = pass1.value, p2 = pass2.value;
    if (!matriculaEscrita) { msg.textContent = "Escribe tu matrícula."; return; }
    if (p1.length < 6) { msg.textContent = "La contraseña debe tener al menos 6 caracteres."; return; }
    if (p1 !== p2) { msg.textContent = "Las contraseñas no coinciden."; return; }
    inp.blur(); pass1.blur(); pass2.blur();
    b.disabled = true;
    volver.disabled = true;
    b.textContent = "Guardando...";
    msg.textContent = "";
    crearContrasena(matriculaEscrita, p1).then(function (r) {
      pass1.value = ""; pass2.value = "";
      if (!r || !r.ok) {
        msg.textContent = mensajeAcceso(r || {});
        b.disabled = false;
        volver.disabled = false;
        b.textContent = "Guardar contraseña";
        return;
      }
      // Contraseña creada y guardada: se regresa al acceso (con la matrícula ya escrita) para
      // que el alumno entre con matrícula y contraseña.
      matriculaEscrita = matriculaEscrita.replace(/\s+/g, "");
      pantallaLogin("Contraseña creada. Ahora entra con tu matrícula y tu contraseña.");
    }).catch(function () {
      msg.textContent = "No se pudo continuar. Revisa tu conexión e inténtalo de nuevo.";
      b.disabled = false;
      volver.disabled = false;
      b.textContent = "Guardar contraseña";
    });
  };
  c.appendChild(b);
  c.appendChild(volver);
  pantalla(c);
}

// Pantalla 2: inicio del alumno (datos + un botón por materia).
function pantallaInicio() {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "FullStatus Student"));

  var perfil = el("div", "", "perfil");
  perfil.appendChild(el("p", alumno.nombre, "perfil-nombre"));
  perfil.appendChild(fila("Matrícula", alumno.matricula));
  perfil.appendChild(fila("Grupo", alumno.grupo));
  c.appendChild(perfil);

  c.appendChild(el("p", "¿Qué quieres hacer?", "seccion-label"));

  // Zona de materias: primero dice "Cargando" y se llena cuando llega la lista.
  var zona = el("div");
  zona.appendChild(el("p", "Cargando materias...", "info"));
  c.appendChild(zona);

  var bSalir = el("button", "Cerrar sesión", "sec");
  bSalir.onclick = pantallaLogin;
  c.appendChild(bSalir);
  pantalla(c);

  cargarMaterias().then(function (filas) {
    MATERIAS = filas;
    zona.innerHTML = "";
    if (!filas.length) {
      zona.appendChild(el("p", "No hay materias disponibles en este momento. Pregúntale a tu profesor.", "aviso"));
      return;
    }
    filas.forEach(function (m) {
      var b = el("button", m.nombre, "menu-boton");
      b.onclick = function () { pantallaUnidades(m); };
      zona.appendChild(b);
    });
  }).catch(function () {
    zona.innerHTML = "";
    zona.appendChild(el("p", "No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.", "aviso"));
    var r = el("button", "Reintentar");
    r.onclick = pantallaInicio;
    zona.appendChild(r);
  });
}

// Pantalla 3: unidades de la materia elegida. Se sacan de las secciones de sus
// preguntas (ver calcularUnidades), así que no hace falta capturarlas aparte.
function pantallaUnidades(m) {
  var c = el("div", "", "card");
  c.appendChild(el("h1", m.nombre, "mayus"));
  var zona = el("div");
  zona.appendChild(el("p", "Cargando unidades...", "info"));
  c.appendChild(zona);
  var volver = el("button", "← Volver al inicio", "sec");
  volver.onclick = pantallaInicio;
  c.appendChild(volver);
  pantalla(c);

  cargarPreguntas(m.id).then(function (preguntas) {
    var unidades = calcularUnidades(preguntas);
    zona.innerHTML = "";
    if (!unidades.length) {
      // Caso normal mientras el profesor no etiquete las secciones como "Unidad N ...".
      zona.appendChild(el("p", "Esta materia todavía no tiene unidades disponibles. Pregúntale a tu profesor.", "aviso"));
      return;
    }
    unidades.forEach(function (u) {
      var b = el("button", u.nombre, "menu-boton");
      b.onclick = function () { pantallaUnidad(m, u); };
      zona.appendChild(b);
    });
  }).catch(function () {
    zona.innerHTML = "";
    zona.appendChild(el("p", "No se pudieron cargar las unidades. Revisa tu conexión e inténtalo de nuevo.", "aviso"));
    var r = el("button", "Reintentar");
    r.onclick = function () { pantallaUnidades(m); };
    zona.appendChild(r);
  });
}

// Pantalla 4: una unidad. Arriba el resumen de asistencias/faltas y abajo el botón
// del examen. Los datos de asistencia se piden cada vez que se abre, así siempre
// reflejan lo último que subió el profesor desde FullStatus. El botón del examen
// está disponible desde el principio (no espera a que lleguen las asistencias).
function pantallaUnidad(m, u) {
  var c = el("div", "", "card");
  c.appendChild(el("p", m.nombre, "seccion-label mayus"));
  c.appendChild(el("h1", u.nombre, "mayus"));

  var zona = el("div");
  zona.appendChild(el("p", "Cargando tus asistencias...", "info"));
  c.appendChild(zona);

  var bEx = el("button", "Hacer examen de la unidad");
  bEx.onclick = function () { confirmarExamen(m, u); };
  c.appendChild(bEx);
  var volver = el("button", "← Volver a las unidades", "sec");
  volver.onclick = function () { pantallaUnidades(m); };
  c.appendChild(volver);
  pantalla(c);

  consultarAsistencias(alumno.matricula).then(function (lista) {
    var a = asistenciaDeMateria(lista, m.nombre);
    zona.innerHTML = "";
    if (!a) {
      // Caso normal: el profesor todavía no ha subido asistencias de este alumno en esta materia.
      zona.appendChild(el("p", "Todavía no hay asistencias registradas para ti en esta materia."));
      return null;
    }
    // Se buscan las fechas de ESTA unidad para recortar el detalle a ese periodo.
    return cargarRangosUnidades(a.grupo, a.materia).then(function (rangos) {
      var rango = null;
      rangos.forEach(function (r) { if (numeroUnidad(r.nombre) === u.num) rango = r; });
      var datos, nota;
      if (rango) {
        // Las fechas llegan como "AAAA-MM-DD": se comparan como texto (sin Date) para que
        // la zona horaria del celular no mueva un día.
        var detalle = (a.detalle || []).filter(function (d) {
          var f = String(d.fecha || "").slice(0, 10);
          return f >= rango.desde && f <= rango.hasta;
        });
        datos = resumenDeDetalle(detalle);
        nota = "Periodo de la unidad: del " + fechaCorta(rango.desde) + " al " + fechaCorta(rango.hasta) + ".";
      } else {
        datos = a;
        nota = "Aún no hay fechas registradas para esta unidad: se muestra el resumen de toda la materia.";
      }
      zona.appendChild(tarjetaAsistencia(datos, true));
      zona.appendChild(el("p", nota, "info"));
    });
  }).catch(function () {
    zona.innerHTML = "";
    zona.appendChild(el("p", "No se pudieron cargar tus asistencias. Revisa tu conexión e inténtalo de nuevo.", "aviso"));
  });
}

// ---- Asistencias ----

// Convierte "2026-09-15" en "15/09/2026". Se parte el texto a mano (sin usar Date)
// para que la zona horaria del celular no desplace la fecha un día.
function fechaCorta(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
  return m ? m[3] + "/" + m[2] + "/" + m[1] : String(iso || "");
}

// Texto y color de la etiqueta de cada día según su estado.
// Estados: P = asistencia, R = retardo, A = falta (con "justificada" si la
// perdonó el profesor; una falta justificada cuenta como asistencia).
function etiquetaEstado(d) {
  if (d.estado === "P") return { texto: "Asistencia", clase: "b-p" };
  if (d.estado === "R") return { texto: "Retardo", clase: "b-r" };
  if (d.estado === "A" && d.justificada) return { texto: "Falta justificada", clase: "b-j" };
  return { texto: "Falta", clase: "b-a" };
}

// Un recuadro de la cuadrícula de totales (número grande + etiqueta).
function recuadroTotal(numero, etiqueta, clase) {
  var r = el("div", "", "stat");
  r.appendChild(el("div", String(numero || 0), "stat-num " + clase));
  r.appendChild(el("div", etiqueta, "stat-etq"));
  return r;
}

// Resumen de asistencias: totales + detalle por fecha (se abre con un botón).
// Los números ya vienen calculados (del servidor o de resumenDeDetalle); aquí solo se muestran.
// "sinTitulo" = true cuando la pantalla que lo contiene ya dice la materia y la unidad.
function tarjetaAsistencia(m, sinTitulo) {
  var caja = el("div", "", "asist-grupo");
  if (!sinTitulo) {
    caja.appendChild(el("h2", m.materia ? m.materia : "Grupo " + m.grupo));
    if (m.materia) caja.appendChild(el("p", "Grupo " + m.grupo, "info"));
  }

  var totales = el("div", "", "stats");
  totales.appendChild(recuadroTotal(m.asistencias, "Asistencias", "s-p"));
  totales.appendChild(recuadroTotal(m.justificadas, "Justificadas", "s-j"));
  totales.appendChild(recuadroTotal(m.faltas, "Faltas", "s-a"));
  totales.appendChild(recuadroTotal(m.retardos, "Retardos", "s-r"));
  caja.appendChild(totales);

  caja.appendChild(el("p", "Faltas equivalentes: " + (m.faltas_equivalentes || 0), "eq"));
  caja.appendChild(el("p", "Cada 3 retardos cuentan como 1 falta. Las faltas justificadas cuentan como asistencia.", "info"));

  var detalle = m.detalle || [];
  var lista = el("div", "", "detalle-lista");
  lista.style.display = "none"; // cerrado al inicio
  detalle.forEach(function (d) {
    var f = el("div", "", "detalle-fila");
    var izq = el("div");
    izq.appendChild(el("div", fechaCorta(d.fecha)));
    if (d.nota) izq.appendChild(el("div", d.nota, "detalle-nota"));
    var et = etiquetaEstado(d);
    f.appendChild(izq);
    f.appendChild(el("span", et.texto, "badge " + et.clase));
    lista.appendChild(f);
  });

  // Se alterna el detalle con un botón dentro de la página (nada de alert/confirm).
  var btn = el("button", "Ver detalle (" + detalle.length + " fechas)", "sec");
  btn.onclick = function () {
    var abierto = lista.style.display !== "none";
    lista.style.display = abierto ? "none" : "block";
    btn.textContent = abierto ? "Ver detalle (" + detalle.length + " fechas)" : "Ocultar detalle";
  };
  caja.appendChild(btn);
  caja.appendChild(lista);
  return caja;
}

// Examen, paso 1: avisos y botón "Comenzar examen". Es el punto donde empieza
// la vigilancia anti-trampa (Android.iniciarExamen), igual que antes.
// "m" = materia { id, nombre }, "u" = unidad { num, nombre }.
function confirmarExamen(m, u) {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Examen"));
  c.appendChild(el("p", m.nombre + " · " + u.nombre, "seccion-label mayus"));
  c.appendChild(el("p", "Tendrás " + DURACION_MIN + " minutos para contestar. Al terminar el tiempo, el examen se entrega solo con lo que lleves.", "aviso"));
  c.appendChild(el("p", "Al comenzar no podrás salir, minimizar, cambiar de pantalla ni tomar capturas. Si lo haces, el examen se cierra y deberás empezar de nuevo.", "aviso"));
  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", "Comenzar examen");
  var volver = el("button", "← Volver", "sec");
  volver.onclick = function () { pantallaUnidad(m, u); };
  b.onclick = function () {
    b.disabled = true;
    volver.disabled = true;
    b.textContent = "Cargando preguntas...";
    msg.textContent = "";
    // Se vuelven a pedir las preguntas de TODA la materia: el servidor califica por
    // posición en esa lista, así que los índices de la unidad deben salir de la lista
    // más reciente (por si el profesor cambió algo desde que se abrió la pantalla).
    cargarPreguntas(m.id).then(function (preguntas) {
      var unidad = null;
      calcularUnidades(preguntas).forEach(function (x) { if (x.num === u.num) unidad = x; });
      if (!unidad) { var e = new Error("sin-preguntas"); e.sinPreguntas = true; throw e; }
      materiaId = m.id;
      PREGUNTAS = preguntas;
      UNIDAD_IDX = unidad.indices;
      // Numeración que ve el alumno: 1, 2, 3... dentro de la unidad (no la posición global).
      NUMERO = {};
      unidad.indices.forEach(function (qi, pos) { NUMERO[qi] = pos + 1; });
      SECCIONES = agruparSecciones(preguntas, unidad.indices);
      setTimeout(function () {
        if (window.Android) Android.iniciarExamen();
        secIdx = 0;
        // -1 = sin responder. Se usa -1 (y no un hueco/null) para que el arreglo
        // enviado al servidor siempre lleve un número por pregunta de la materia; -1
        // nunca coincide con una opción correcta, así que cuenta como mala. Las
        // preguntas de otras unidades se quedan en -1 y no suman "correctas".
        resp = PREGUNTAS.map(function () { return -1; });
        examenTerminado = false;
        avisoFaltantes = false;
        iniciarReloj();
        pantallaSeccion();
      }, 300);
    }).catch(function (e) {
      msg.textContent = e && e.sinPreguntas
        ? "Esta unidad todavía no tiene preguntas disponibles."
        : "No se pudo continuar. Revisa tu conexión e inténtalo de nuevo.";
      b.disabled = false;
      volver.disabled = false;
      b.textContent = "Comenzar examen";
    });
  };
  c.appendChild(b);
  c.appendChild(volver);
  pantalla(c);
}

// Agrupa las preguntas de la unidad (ya ordenadas) en secciones: cada vez que cambia
// el texto de "seccion" respecto a la pregunta anterior empieza un grupo nuevo.
// Las preguntas sin sección que van seguidas forman un solo grupo sin título.
// "indices" son los índices de la unidad en PREGUNTAS; cada grupo guarda esos mismos
// índices (así resp[] sigue siendo plano y alineado con la lista completa).
function agruparSecciones(preguntas, indices) {
  var grupos = [];
  indices.forEach(function (i) {
    var p = preguntas[i];
    var ultimo = grupos[grupos.length - 1];
    if (ultimo && ultimo.nombre === p.s) ultimo.indices.push(i);
    else grupos.push({ nombre: p.s, indices: [i] });
  });
  return grupos;
}

// Arma el bloque de "contexto" que va arriba de una pregunta (si trae uno):
// video de YouTube si se detecta un link, o un bloque de texto plano si no
// (instrucciones, pasaje de lectura, etc.).
//
// Regresa { nodo, iniciar }: "nodo" es lo que se agrega a la pantalla; "iniciar"
// (solo en videos) se llama DESPUÉS de que el nodo ya está en el documento, porque
// la API de YouTube necesita encontrar el contenedor en pantalla para reemplazarlo
// por el reproductor.
function bloqueContexto(p) {
  if (!p.x) return null;
  var idVideo = extraerIdYoutube(p.x);
  if (idVideo) {
    var caja = el("div");
    var envoltorio = el("div", "", "video-envoltorio");
    var destino = el("div");
    destino.id = "yt-destino-" + (++ytContador);
    envoltorio.appendChild(destino);
    var aviso = el("p", "", "video-aviso");
    caja.appendChild(envoltorio);
    caja.appendChild(aviso);
    return { nodo: caja, iniciar: function () { crearReproductor(destino.id, idVideo, aviso); } };
  }
  return { nodo: el("div", p.x, "contexto-texto"), iniciar: null };
}

// Cuenta cuántas preguntas de LA UNIDAD siguen sin responder (las de otras
// unidades van en -1 a propósito y no deben contarse).
function contarSinResponder() {
  return UNIDAD_IDX.filter(function (qi) { return resp[qi] < 0; }).length;
}

// Muestra UNA sección completa: todas sus preguntas en la misma pantalla.
// El contexto (video/texto) se muestra solo cuando cambia respecto a la
// pregunta anterior de la sección; si 10 preguntas comparten un mismo video o
// pasaje, aparece una vez arriba de ellas y no 10 veces.
function pantallaSeccion() {
  var g = SECCIONES[secIdx];
  var esUltima = secIdx + 1 >= SECCIONES.length;
  var c = el("div", "", "card");
  c.appendChild(el("p", "Sección " + (secIdx + 1) + " de " + SECCIONES.length + " · " + g.indices.length + " pregunta(s)"));
  if (g.nombre) c.appendChild(el("p", g.nombre, "seccion-label"));

  var iniciadores = [];   // funciones que arrancan los videos cuando la tarjeta ya está en pantalla
  var contextoPrevio = null;

  g.indices.forEach(function (qi) {
    var p = PREGUNTAS[qi];
    var bloque = el("div", "", "pregunta-bloque");
    if (p.x && p.x !== contextoPrevio) {
      var ctx = bloqueContexto(p);
      bloque.appendChild(ctx.nodo);
      if (ctx.iniciar) iniciadores.push(ctx.iniciar);
    }
    contextoPrevio = p.x || null;

    bloque.appendChild(el("h2", NUMERO[qi] + ". " + p.t));
    p.o.forEach(function (txt, i) {
      var b = el("button", String.fromCharCode(65 + i) + ") " + txt, "op" + (resp[qi] === i ? " sel" : ""));
      b.onclick = function () {
        resp[qi] = i;
        // Solo se repintan las opciones de ESTA pregunta (no se vuelve a dibujar
        // la pantalla, para no reiniciar los videos).
        var hermanas = bloque.querySelectorAll(".op");
        for (var k = 0; k < hermanas.length; k++) hermanas[k].className = "op" + (k === i ? " sel" : "");
      };
      bloque.appendChild(b);
    });
    c.appendChild(bloque);
  });

  var msg = el("p", avisoFaltantes && esUltima ? "Te faltan " + contarSinResponder() + " pregunta(s) sin responder. Revisa las secciones anteriores o toca de nuevo para terminar." : "", "aviso");
  c.appendChild(msg);

  if (secIdx > 0) {
    var ant = el("button", "← Sección anterior", "sec");
    ant.onclick = function () { secIdx--; pantallaSeccion(); };
    c.appendChild(ant);
  }
  var sig = el("button", esUltima ? (avisoFaltantes ? "Terminar de todos modos" : "Terminar examen") : "Siguiente sección →");
  sig.onclick = function () {
    if (!esUltima) { secIdx++; pantallaSeccion(); return; }
    // Última sección: si faltan respuestas se avisa UNA vez (sin confirm(), que
    // en el WebView no funciona y además robaría el foco y anularía el examen).
    var faltan = contarSinResponder();
    if (faltan > 0 && !avisoFaltantes) {
      avisoFaltantes = true;
      msg.textContent = "Te faltan " + faltan + " pregunta(s) sin responder. Revisa las secciones anteriores o toca de nuevo para terminar.";
      sig.textContent = "Terminar de todos modos";
      return;
    }
    fin(false);
  };
  c.appendChild(sig);
  pantalla(c);
  // Los reproductores se crean hasta que la tarjeta ya está en pantalla (ver bloqueContexto).
  iniciadores.forEach(function (f) { f(); });
}

// Termina el examen (por botón o por fin del tiempo) y manda a calificar.
// "porTiempo" solo cambia el texto que ve el alumno.
function fin(porTiempo) {
  if (examenTerminado) return; // ya se está calificando
  examenTerminado = true;
  detenerReloj();
  if (window.Android) Android.terminarExamen();
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Calificando..."));
  if (porTiempo) c.appendChild(el("p", "Se acabó el tiempo. Se entregan las respuestas que llevabas.", "aviso"));
  c.appendChild(el("p", "Espera un momento."));
  pantalla(c);
  intentarCalificar();
}

function intentarCalificar() {
  calificarExamen(materiaId, alumno.matricula, resp).then(function (resultado) {
    var c = el("div", "", "card");
    c.appendChild(el("h1", "Examen terminado"));
    // El total que se muestra es el de la UNIDAD (el "total" del servidor cuenta toda la materia).
    c.appendChild(el("p", alumno.nombre + ": " + resultado.correctas + " de " + UNIDAD_IDX.length + " correctas"));
    var b = el("button", "Salir");
    b.onclick = function () { if (window.Android) Android.salir(); else pantallaInicio(); };
    c.appendChild(b);
    pantalla(c);
  }).catch(function () {
    var c = el("div", "", "card");
    c.appendChild(el("h1", "No se pudo calificar"));
    c.appendChild(el("p", "Revisa tu conexión e inténtalo de nuevo. Tus respuestas no se han perdido.", "aviso"));
    var b = el("button", "Reintentar");
    b.onclick = intentarCalificar;
    c.appendChild(b);
    pantalla(c);
  });
}

pantallaLogin();
</script>
