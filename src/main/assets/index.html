<!DOCTYPE html>
<!--
  FullStatus Student · App del alumno
  Propiedad intelectual de PRISMAL MESH. Todos los derechos reservados.

  HISTORIAL
  - 10/oct/2026: flujo de pantallas con matrícula, pantalla de inicio y vigilancia anti-trampa
    que empieza solo al pulsar "Comenzar examen". Asistencias reales vía RPC consultar_asistencias.
  - 12/oct/2026: CONTRASEÑA DEL ALUMNO. El login pide matrícula y contraseña (RPC validar_acceso,
    compara contra un hash bcrypt). Debajo del botón Entrar hay un enlace "Crear contraseña" que
    lleva a otra ventana (RPC crear_contrasena, una sola vez por matrícula); al guardar regresa al
    acceso para entrar con matrícula y contraseña. Tras 5 fallos seguidos el servidor bloquea la
    matrícula 10 minutos. Si la matrícula no existe, en ambas ventanas sale "Matrícula no registrada".

  CAMBIO (23/oct/2026): NUEVO FLUJO DE PANTALLAS (reemplaza el de materia → unidad de oct/10).
    1) Inicio: nombre, matrícula, grado, grupo y fecha de hoy; debajo "Materias" con un botón por
       cada materia DEL ALUMNO (INGLÉS I, INGLÉS VI, INGLÉS IX...). RPC mis_materias: salen de las
       materias donde tiene asistencias, más los exámenes que tenga asignados.
       El grado y el grupo salen de alumnos.grupo ("10B" → grado 10, grupo B).
    2) Materia: totales de asistencias, faltas y retardos (RPC consultar_asistencias) y el botón
       "Exámenes".
    3) Exámenes: lista de los exámenes de esa materia (RPC mis_examenes). Un examen pertenece a la
       materia si su nombre es igual o empieza con él: "INGLÉS VI" o "INGLÉS VI - Unidad 1". Cada
       examen se ACTIVA solo si el profesor se lo asignó al alumno (tabla asignaciones) y está dentro
       de su ventana de fechas; si no, sale en gris con el motivo. Ya no se separan unidades por
       preguntas.seccion: cada examen es una fila de la tabla materias y se presenta completo.
    4) El examen usa el flujo FIRMADO del servidor: iniciar_intento → obtener_preguntas →
       guardar_progreso (mientras contesta) → calificar_examen. La firma HMAC la calcula la app
       Android (Puente.firmar en MainActivity); la clave nunca llega al JS. El tiempo restante lo
       manda el servidor. Si el alumno sale de la app y vuelve, es una REANUDACIÓN (máximo
       configurable en el servidor) y recupera las respuestas que había guardado.

  CAMBIO (25/oct/2026): TIPOS DE EXAMEN. Los exámenes de una materia salen en este orden:
    1) Ordinario (para todos)  2) Remedial (alumnos que reprobaron la materia)
    3) Extraordinario (reprobaron el remedial)  4) Extraordinario 2 (reprobaron el extraordinario).
    El tipo se reconoce por el NOMBRE del examen en la tabla materias ("INGLÉS VI - Remedial"); un
    nombre sin tipo cuenta como Ordinario. Los tres de recuperación solo aparecen al alumno si el
    profesor se los asignó; el Ordinario siempre aparece. El orden y el filtro los hace el
    servidor en mis_examenes; aquí solo se muestra el tipo sobre el nombre de cada examen.

  CAMBIO (25/oct/2026, 2): EXÁMENES POR UNIDAD. Una materia puede tener varias unidades y cada
    unidad su propio examen (p. ej. INGLÉS I: Unidad 1 y Unidad 2). La unidad se reconoce por el
    NOMBRE del examen ("INGLÉS I - Unidad 1 - Ordinario"). La lista sale agrupada por unidad, con
    un encabezado "UNIDAD N", y dentro de cada unidad en el orden Ordinario, Remedial,
    Extraordinario, Extraordinario 2. Remedial y extraordinarios solo aparecen si el profesor se
    los asignó al alumno. Un examen sin "Unidad N" en el nombre sale primero, sin encabezado.
    El número de unidades de cada materia vive en la tabla materia_unidades (INGLÉS I: 2,
    INGLÉS VI: 3, INGLÉS IX: 2): las unidades que todavía no tienen examen creado salen con el
    aviso desactivado "Aún no hay examen para esta unidad" (estado "sin_examen").

  CAMBIO (25/oct/2026, 3): MENÚ LATERAL. La pantalla de inicio muestra los datos del alumno (nombre,
    matrícula, grado, grupo y fecha de hoy). En la esquina izquierda hay un botón de 3 rayas que abre
    un panel deslizable (mitad de la pantalla) con "Materias" —un botón por materia del alumno— y,
    hasta abajo, "Cerrar sesión". Tocar el fondo oscuro cierra el panel.

  CAMBIO (25/oct/2026, 4): ASISTENCIAS POR UNIDAD. La pantalla de la materia ya no muestra todas las
    fechas: muestra un bloque por UNIDAD (con su periodo, totales de asistencias, justificadas, faltas
    y retardos, y el detalle solo de las fechas de esa unidad). Las unidades y sus fechas (desde/hasta)
    las registra el profesor en FullStatus (tabla unidades) y llegan dentro de consultar_asistencias.
    Si la materia aún no tiene unidades con fechas, se avisa en pantalla y no se muestran fechas.

  CAMBIO (25/oct/2026, 5): CALIFICACIÓN POR UNIDAD (solo lectura). Cada bloque de unidad muestra primero
    su calificación sobre 10 con el desglose: asistencias, actividades (entregadas de total),
    participaciones y examen, cada una con sus puntos. Los puntos y las ponderaciones los controla el
    profesor en FullStatus y los publica con publicar_calificaciones; la app solo los muestra
    (RPC mis_calificaciones). Estado: "En curso" mientras falte el examen; con examen, "Aprobada" o
    "En remedial" si la suma es menor al mínimo (config.minimo_aprobatorio, 7).
-->

<style>

  #reloj .reloj-alumno { font-size: 12px; font-weight: 400; margin-top: 2px; }
  /* Últimos 5 minutos: se pone rojo para avisar al alumno. */
  #reloj.poco { background: #b71c1c; }
  body.con-reloj { padding-top: 76px; }
  /* --- Contexto por pregunta (video embebido o texto de apoyo/lectura) ---
     El video SIEMPRE va embebido (iframe), nunca como link externo: un link
     que abra YouTube fuera de la app cancelaría el examen (ver anularExamen()
     en MainActivity.java — onPause()/onWindowFocusChanged() cierran la app si

  .video-envoltorio {

    margin-bottom: 12px; border-radius: 8px; overflow: hidden; background: #000;

  }
  /* Mensaje que aparece bajo el video cuando el reproductor de YouTube falla
     (ver crearReproductor()). */

  /* --- Pantalla de inicio (después de entrar) ---
     Tarjeta con los datos del alumno y un menú de botones grandes. */
  .perfil { background: #eef4fb; border-radius: 10px; padding: 12px 14px; margin: 12px 0 18px; }
  .perfil-nombre { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  .dato { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #d3e2f4; font-size: 15px; }
  .dato-etq { color: #555; }
  .dato-val { font-weight: 600; text-align: right; }
  .menu-boton { padding: 20px 16px; font-size: 18px; text-align: left; text-transform: uppercase; }
  .info { font-size: 14px; color: #444; }

  /* --- Menú lateral de la pantalla de inicio ---
     Botón de 3 rayas en la esquina izquierda; al tocarlo, un panel se desliza desde la izquierda
     hasta la mitad de la pantalla con "Materias" arriba y "Cerrar sesión" hasta abajo. El fondo
     oscuro cierra el panel al tocarlo. */
  .barra { display: flex; align-items: center; gap: 12px; }
  .barra h1 { margin: 0; }
  button.hamb { width: 44px; height: 44px; padding: 0; margin: 0; flex: none; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
  button.hamb span { display: block; width: 22px; height: 3px; border-radius: 2px; background: #fff; }
  #menu-fondo { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #menu-fondo.abierto { opacity: 1; pointer-events: auto; }
  #menu-panel { position: fixed; top: 0; bottom: 0; left: 0; z-index: 21; width: 50%; min-width: 220px; background: #fff; padding: 16px; display: flex; flex-direction: column; overflow-y: auto; transform: translateX(-100%); transition: transform .25s; }
  #menu-panel.abierto { transform: translateX(0); }
  #menu-panel .menu-zona { flex: 1; }
  #menu-panel .menu-boton { padding: 14px 12px; font-size: 15px; }

  /* --- Lista de exámenes de una materia ---
     Una tarjeta por examen con su estado; el botón se activa solo si el profesor lo asignó. */
  .ex-item { border: 2px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-top: 10px; }

  .unidad-bloque { border-top: 2px solid #e0e0e0; margin-top: 18px; padding-top: 14px; }
  .unidad-bloque:first-of-type { border-top: 0; margin-top: 6px; padding-top: 0; }

  /* Calificación de la unidad: total sobre 10, estado (En curso / Aprobada / En remedial) y desglose. */
  .cal-caja { background: #f1f5fb; border-radius: 10px; padding: 12px; margin: 10px 0; }
  .cal-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }

  .cal-etq { font-size: 12px; color: #555; margin-top: 2px; }

  .cal-fila b { white-space: nowrap; }

  .asist-grupo { border-top: 1px solid #e0e0e0; padding-top: 14px; margin-top: 14px; }
  .asist-grupo:first-of-type { border-top: 0; margin-top: 6px; padding-top: 0; }
  .asist-grupo h2 { font-size: 18px; margin: 0 0 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .stat { background: #f1f5fb; border-radius: 10px; padding: 10px 6px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; line-height: 1.1; }

  .s-p { color: #2e7d32; } .s-j { color: #1565c0; } .s-a { color: #c62828; } .s-r { color: #ef6c00; }
  .eq { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
  .detalle-lista { margin-top: 6px; }

  .detalle-nota { font-size: 12px; color: #555; margin-top: 2px; }

<body>
<div id="app"></div>
<script>
// ---- Conexión con Supabase ----
// La clave "anon"/"publishable" está pensada para ir en el cliente: por sí sola
// no permite hacer nada que las políticas de RLS y los permisos de las funciones en la
// base de datos no permitan. Todo lo sensible (contraseñas, respuestas correctas,
// asistencias de otros alumnos) solo se toca desde funciones RPC del servidor.
var SUPABASE_URL = "https://juvqvshcfsrtscvzluaa.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1dnF2c2hjZnNydHNjdnpsdWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDY4NjQsImV4cCI6MjEwNTg4Mjg2NH0.aL2bzJbTJ6DfzUlh8UaSBZ5Fah3Bae1tNBDi7R6BD68";

// Llama a una función RPC de Supabase. Regresa una promesa con el JSON de la respuesta; si el
// servidor rechaza la llamada, la promesa falla con un Error cuyo .message es el texto que
// lanzó la función (p. ej. "Examen no disponible (no_asignado)").
function rpc(nombre, cuerpo) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + nombre, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(cuerpo)
  }).then(function (resp) {
    if (resp.ok) return resp.json();
    return resp.text().then(function (t) {
      var msg = t;
      try { msg = JSON.parse(t).message || t; } catch (e) { /* texto plano */ }
      throw new Error(msg || "Error del servidor");
    });
  });
}

// ---- Acceso con matrícula + contraseña (en el servidor) ----
// La lista de alumnos y sus contraseñas viven en la tabla "alumnos" de Supabase y el
// rol anon NO puede leerla. Solo puede llamar a estas funciones, que regresan siempre
// un objeto { ok: true|false, ... } (no lanzan error para que el servidor pueda contar
// los intentos fallidos):
//   validar_acceso(p_matricula, p_contrasena)  -> { ok, matricula, nombre, grupo }
//                                                 o { ok:false, motivo, minutos? }
//   crear_contrasena(p_matricula, p_contrasena) -> igual; solo funciona si aún no tiene.
// motivo: no_registrada | sin_contrasena | incorrecta | bloqueado | ya_tiene | invalida
function llamarAcceso(funcion, matricula, contrasena) {
  var m = String(matricula || "").replace(/\s+/g, "");
  return rpc(funcion, { p_matricula: m, p_contrasena: String(contrasena || "") });
}
function iniciarSesion(matricula, contrasena) { return llamarAcceso("validar_acceso", matricula, contrasena); }
function crearContrasena(matricula, contrasena) { return llamarAcceso("crear_contrasena", matricula, contrasena); }

// Texto para el alumno según el "motivo" que regresa el servidor.
function mensajeAcceso(r) {
  if (r.motivo === "no_registrada") return "Matrícula no registrada";
  if (r.motivo === "sin_contrasena") return "Esta matrícula aún no tiene contraseña. Toca «Crear contraseña».";
  if (r.motivo === "incorrecta") return "Matrícula o contraseña incorrecta.";
  if (r.motivo === "bloqueado") return "Demasiados intentos fallidos. Espera " + (r.minutos || 10) + " minuto(s) e inténtalo de nuevo.";
  if (r.motivo === "ya_tiene") return "Esta matrícula ya tiene contraseña. Regresa al acceso y entra con ella; si la olvidaste, pide a tu profesor que la restablezca.";
  if (r.motivo === "invalida") return "La contraseña debe tener al menos 6 caracteres.";
  return "No se pudo continuar. Inténtalo de nuevo.";
}

// ---- Datos del alumno (funciones RPC de solo lectura) ----
// mis_materias(p_matricula)            -> [{ nombre }]  materias de ESTE alumno
// consultar_asistencias(p_matricula)   -> [{ grupo, materia, asistencias, justificadas, faltas,
//                                            retardos, faltas_equivalentes, detalle: [...] }]
// mis_examenes(p_matricula, p_materia) -> [{ id, nombre, estado, correctas, total, reanudaciones,
//                                            max_reanudaciones, abre_en, cierra_en }]
//   estado: disponible | en_curso | presentado | no_asignado | aun_no_abre | cerrado
function misMaterias(matricula) { return rpc("mis_materias", { p_matricula: String(matricula || "") }); }
function consultarAsistencias(matricula) { return rpc("consultar_asistencias", { p_matricula: String(matricula || "") }); }
// mis_calificaciones(p_matricula, p_materia) -> [{ unidad, orden, asistencias, actividades,
//   participaciones, examen, calificacion, completa, en_remedial, minimo, n_actividades,
//   total_actividades, n_participaciones }]
// Los puntos de cada parte y su ponderación los controla el profesor en FullStatus; aquí solo se
// muestran. calificacion = suma de las 4 partes (sobre 10). Si el examen ya tiene puntos y la suma
// es menor al mínimo (7), en_remedial = true.
function misCalificaciones(materia) { return rpc("mis_calificaciones", { p_matricula: alumno.matricula, p_materia: String(materia || "") }); }
function misExamenes(matricula, materia) { return rpc("mis_examenes", { p_matricula: String(matricula || ""), p_materia: String(materia || "") }); }

// ---- Examen: llamadas FIRMADAS al servidor ----
// iniciar_intento, obtener_preguntas, guardar_progreso y calificar_examen exigen una firma
// HMAC-SHA256 de "accion|matricula|materiaId|ts". La calcula la app Android (Puente.firmar en
// MainActivity.java) con una clave que nunca llega a este JS. "ts" son segundos desde 1970 y el
// servidor solo acepta firmas recientes (el reloj del celular debe estar bien). Fuera de la app
// (en un navegador) no existe window.Android, la firma va vacía y el servidor la rechaza.
function firmar(accion, matricula, materiaId) {
  var ts = Math.floor(Date.now() / 1000);
  var f = "";
  try { if (window.Android && Android.firmar) f = Android.firmar(accion, matricula, String(materiaId), String(ts)) || ""; } catch (e) { f = ""; }
  return { p_ts: ts, p_firma: f };
}
function conFirma(accion, matricula, materiaId, cuerpo) {
  var s = firmar(accion, matricula, materiaId);
  cuerpo.p_ts = s.p_ts;
  cuerpo.p_firma = s.p_firma;
  return cuerpo;
}

// Abre (o reanuda) el intento del examen. Regresa { estado: ok|usado|agotado|anulado, ... }; con
// "ok" trae restante_seg, reanudado, reanudaciones, max_reanudaciones y respuestas_parciales.
function iniciarIntento(examenId) {
  return rpc("iniciar_intento", conFirma("iniciar", alumno.matricula, examenId, { p_matricula: alumno.matricula, p_materia_id: examenId }));
}

// Pide las preguntas del examen (sin respuestas correctas: el servidor nunca las entrega).
function obtenerPreguntas(examenId) {
  return rpc("obtener_preguntas", conFirma("preguntas", alumno.matricula, examenId, { p_matricula: alumno.matricula, p_materia_id: examenId }))
    .then(function (filas) {
      return filas.map(function (f) { return { t: f.texto, o: f.opciones, x: f.contexto || null, s: f.seccion || null }; });
    });
}

// Guarda el avance (un número por pregunta, -1 = sin responder). Si el tiempo se acaba o la app
// se cierra, el servidor califica ese avance.
function guardarProgreso(examenId, respuestas) {
  return rpc("guardar_progreso", conFirma("progreso", alumno.matricula, examenId, { p_matricula: alumno.matricula, p_materia_id: examenId, p_respuestas: respuestas }));
}

// La calificación se calcula en el servidor, que es el único que puede leer cuál era la opción
// correcta. Regresa { id, correctas, total }.
function calificarExamen(examenId, respuestas) {
  return rpc("calificar_examen", conFirma("calificar", alumno.matricula, examenId, { p_materia_id: examenId, p_matricula: alumno.matricula, p_respuestas: respuestas }));
}

// Convierte el texto de un error del servidor en un mensaje para el alumno.
function mensajeErrorServidor(e) {
  var t = String((e && e.message) || "");
  if (/firma/i.test(t)) return "La app no pudo validar tu examen. Actualiza la app o avisa a tu profesor.";
  if (/reloj|desajust/i.test(t)) return "La hora de tu celular está desajustada. Corrígela e inténtalo de nuevo.";
  var m = /Examen no disponible \((\w+)\)/.exec(t);
  if (m) return textoMotivo(m[1]);
  if (/no tiene preguntas activas/i.test(t)) return "Este examen todavía no tiene preguntas disponibles.";
  if (/Intento ya utilizado/i.test(t)) return "Este examen ya fue enviado.";
  if (/Tiempo agotado/i.test(t)) return "Se acabó el tiempo de este examen.";
  return "No se pudo continuar. Revisa tu conexión e inténtalo de nuevo.";
}
function textoMotivo(motivo) {
  if (motivo === "no_asignado") return "Este examen no está asignado para ti.";
  if (motivo === "aun_no_abre") return "Este examen aún no abre.";
  if (motivo === "cerrado") return "Este examen ya cerró.";
  return "Este examen no está disponible por ahora.";
}

// Busca un link de YouTube (youtube.com/watch?v=, youtu.be/, o ya en formato
// /embed/) dentro de un texto libre y regresa solo el ID del video, o null si no
// encuentra ninguno. Se usa para decidir si el "contexto" de una pregunta
// se muestra como video embebido o como bloque de texto plano.
function extraerIdYoutube(texto) {
  if (!texto) return null;
  var m = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/.exec(texto);
  return m ? m[1] : null;
}

// ---- Reproductor de YouTube (API oficial de iframe) ----
// La página se identifica ante YouTube con su origen (parámetro "origin"), que
// es lo que el reproductor exige, y la API avisa el CÓDIGO del error (onError),
// que se muestra bajo el video para saber la causa real.
//
// La API es https://www.youtube.com/iframe_api; al cargar llama a la función global
// onYouTubeIframeAPIReady. Mientras no esté lista, las peticiones de video se
// guardan en ytCola y se ejecutan cuando llegue.
var ytListo = false;
var ytCola = [];
var ytContador = 0; // para dar un id único a cada contenedor de reproductor

window.onYouTubeIframeAPIReady = function () {
  ytListo = true;
  ytCola.forEach(function (f) { f(); });
  ytCola = [];
};

function cargarApiYoutube() {
  if (document.getElementById("yt-api")) return; // ya se pidió
  var s = document.createElement("script");
  s.id = "yt-api";
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}

// Texto para el alumno/profesor según el código de error de YouTube.
function mensajeErrorVideo(codigo) {
  if (codigo === 101 || codigo === 150) return "El dueño del video no permite verlo dentro de otras apps (código " + codigo + "). Avisa a tu profesor.";
  if (codigo === 100) return "El video no existe o es privado (código 100). Avisa a tu profesor.";
  if (codigo === 153) return "YouTube rechazó la configuración del reproductor (código 153). Avisa a tu profesor.";
  if (codigo === 2) return "El enlace del video no es válido (código 2). Avisa a tu profesor.";
  return "No se pudo reproducir el video (código " + codigo + "). Avisa a tu profesor.";
}

// Crea el reproductor dentro de "destino" (un <div> ya presente en la pantalla).
// "aviso" es el elemento donde se escribe el mensaje si algo falla.
function crearReproductor(destino, idVideo, aviso) {
  function iniciar() {
    var vars = { playsinline: 1, rel: 0 };
    // origin = origen de esta página (https://<id de la app>, ver MainActivity.origenBase()).
    // Si el WebView reportara "null" no se manda, para no dar un origen inválido.
    if (window.location.origin && window.location.origin !== "null") vars.origin = window.location.origin;
    new YT.Player(destino, {
      videoId: idVideo, width: "100%", height: "100%", playerVars: vars,
      events: { onError: function (e) { aviso.textContent = mensajeErrorVideo(e.data); } }
    });
  }
  if (ytListo) { iniciar(); return; }
  ytCola.push(iniciar);
  cargarApiYoutube();
  // Si en 8 s la API no llegó (sin internet, bloqueada), se avisa en vez de dejar el cuadro negro.
  setTimeout(function () {
    if (!ytListo) aviso.textContent = "No se pudo cargar el reproductor de YouTube. Revisa tu conexión.";
  }, 8000);
}

function el(tag, texto, clase) {

  if (clase) e.className = clase;
  return e;

// Formatea milisegundos como mm:ss (o h:mm:ss si hay horas).
function formatoTiempo(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = s % 60;
  function dos(n) { return (n < 10 ? "0" : "") + n; }
  return (h > 0 ? h + ":" : "") + dos(m) + ":" + dos(seg);
}

// Arranca el reloj con los segundos que el SERVIDOR dice que quedan (restanteSeg). Se usa una
// HORA DE FIN (Date.now() + restante) y no un contador que resta 1 cada segundo: así, si el
// WebView atrasa algún tick, el tiempo restante sigue siendo correcto.
function iniciarReloj(restanteSeg) {
  var barra = document.getElementById("reloj");
  if (!barra) {
    barra = el("div");
    barra.id = "reloj";
    document.body.appendChild(barra);
  }
  barra.innerHTML = "";
  var lineaTiempo = el("div", "", "reloj-tiempo");
  barra.appendChild(lineaTiempo);
  barra.appendChild(el("div", alumno.nombre + " · " + alumno.matricula + " · Grupo " + alumno.grupo, "reloj-alumno"));
  document.body.classList.add("con-reloj");
  relojFin = Date.now() + Math.max(0, restanteSeg) * 1000;
  function tick() {
    var restante = relojFin - Date.now();
    lineaTiempo.textContent = "⏱ " + formatoTiempo(restante);
    barra.className = restante <= 5 * 60 * 1000 ? "poco" : "";
    if (restante <= 0) fin(true); // se acabó el tiempo: se entrega lo que haya
  }
  tick();
  relojTimer = setInterval(tick, 1000);
}

// Detiene y quita el reloj de la pantalla.
function detenerReloj() {
  if (relojTimer) { clearInterval(relojTimer); relojTimer = null; }
  var barra = document.getElementById("reloj");
  if (barra) barra.parentNode.removeChild(barra);
  document.body.classList.remove("con-reloj");
}

// ---- Flujo de pantallas (23/oct/2026) ----
// 1) pantallaLogin: matrícula + contraseña (se validan en el servidor).
//    1b) pantallaCrearContrasena: el alumno que aún no tiene contraseña la crea (una sola vez).
// 2) pantallaInicio: datos del alumno (nombre, matrícula, grado, grupo, fecha) + "Materias".
// 3) pantallaMateria: asistencias, faltas y retardos de la materia + botón "Exámenes".
// 4) pantallaExamenes: exámenes de la materia; se activan los que el profesor asignó.
// 5) confirmarExamen -> examen (pantallaSeccion) -> resultado.
// La vigilancia anti-trampa (Android.iniciarExamen) empieza SOLO en el paso 5, al
// pulsar "Comenzar examen", así que moverse por las pantallas 1 a 4 no anula nada.

// ---- Utilidades ----

// Normaliza un nombre para compararlo: sin acentos, sin espacios ni signos y en
// minúsculas. Sirve para unir la materia de las asistencias con la del botón aunque se hayan
// escrito un poco distinto ("Inglés I" / "INGLES I").
function clave(texto) {
  return String(texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

// Busca, en la lista de asistencias del alumno, el registro de una materia por nombre.
function asistenciaDeMateria(lista, nombreMateria) {
  var k = clave(nombreMateria);
  for (var i = 0; i < (lista || []).length; i++) {
    if (clave(lista[i].materia) === k) return lista[i];
  }
  return null;
}

// Recalcula los totales de asistencia a partir de una lista de fechas (el detalle ya recortado al
// periodo de una unidad). Misma regla de siempre: una falta justificada se cuenta aparte y
// 3 retardos = 1 falta equivalente.
function resumenDeDetalle(detalle) {
  var r = { asistencias: 0, justificadas: 0, faltas: 0, retardos: 0, detalle: detalle };
  detalle.forEach(function (d) {
    if (d.estado === "P") r.asistencias++;
    else if (d.estado === "R") r.retardos++;
    else if (d.estado === "A") { if (d.justificada) r.justificadas++; else r.faltas++; }
  });
  r.faltas_equivalentes = r.faltas + Math.floor(r.retardos / 3);
  return r;
}

// "10B" -> { grado: "10", grupo: "B" }. El servidor guarda grado y grupo juntos en alumnos.grupo.
function separarGrupo(g) {
  var m = /^\s*(\d+)\s*(.*)$/.exec(String(g || ""));
  if (!m) return { grado: "—", grupo: String(g || "—") };
  return { grado: m[1], grupo: (m[2] || "—").toUpperCase() };
}

// Fecha de hoy en español, p. ej. "Viernes 23 de octubre de 2026" (sin depender del idioma del celular).
var DIAS_ES = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
var MESES_ES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
function fechaHoy() {
  var d = new Date();
  return DIAS_ES[d.getDay()] + " " + d.getDate() + " de " + MESES_ES[d.getMonth()] + " de " + d.getFullYear();
}

// Fecha y hora local de un instante ISO, p. ej. "09/10/2026 14:00" ("" si no se puede leer).
function fechaHora(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  function dos(n) { return (n < 10 ? "0" : "") + n; }
  return dos(d.getDate()) + "/" + dos(d.getMonth() + 1) + "/" + d.getFullYear() + " " + dos(d.getHours()) + ":" + dos(d.getMinutes());
}

// Valor del número romano con el que termina un nombre ("INGLÉS IX" -> 9; sin romano -> 0).
function valorRomano(nombre) {
  var m = /\b([IVXLCM]+)\s*$/i.exec(String(nombre || ""));
  if (!m) return 0;
  var mapa = { I: 1, V: 5, X: 10, L: 50, C: 100, M: 1000 }, t = m[1].toUpperCase(), v = 0;
  for (var i = 0; i < t.length; i++) {
    var a = mapa[t.charAt(i)], b = mapa[t.charAt(i + 1)] || 0;
    v += a < b ? -a : a;
  }
  return v;
}
// Ordena las materias por nombre y, dentro del mismo nombre, por número romano (I, VI, IX...).
function ordenarMaterias(lista) {
  function base(n) { return String(n || "").replace(/\s*[IVXLCM]+\s*$/i, "").toLowerCase(); }
  return (lista || []).slice().sort(function (a, b) {
    var pa = base(a.nombre), pb = base(b.nombre);
    if (pa !== pb) return pa < pb ? -1 : 1;
    return valorRomano(a.nombre) - valorRomano(b.nombre);
  });
}

// Fila "etiqueta ... valor" de la tarjeta de datos del alumno.
function fila(etiqueta, valor) {
  var f = el("div", "", "dato");
  f.appendChild(el("span", etiqueta, "dato-etq"));
  f.appendChild(el("span", valor, "dato-val"));
  return f;
}

// Campo de contraseña: type="password" oculta lo escrito; autocomplete="off" evita que
// el teclado la sugiera/guarde. Se usa en el login y en "Crear contraseña".
function campoContrasena() {
  var inp = el("input");
  inp.type = "password";
  inp.setAttribute("autocomplete", "off");
  return inp;
}

// Pantalla 1: entrar con la matrícula y la contraseña.
// "mensajeOk" (opcional): texto verde que se muestra arriba, p. ej. al volver de crear la contraseña.
function pantallaLogin(mensajeOk) {
  alumno = null;
  var c = el("div", "", "card");
  c.appendChild(el("h1", "FullStatus Student"));
  if (mensajeOk) c.appendChild(el("p", mensajeOk, "ok"));
  c.appendChild(el("p", "Escribe tu matrícula y tu contraseña para entrar:"));

  c.appendChild(el("p", "Matrícula", "campo-etq"));
  var inp = el("input");
  inp.type = "text";
  inp.setAttribute("inputmode", "numeric");
  inp.setAttribute("autocomplete", "off");
  inp.value = matriculaEscrita;
  c.appendChild(inp);

  c.appendChild(el("p", "Contraseña", "campo-etq"));
  var pass = campoContrasena();
  c.appendChild(pass);

  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", "Entrar");
  b.onclick = function () {
    matriculaEscrita = inp.value.trim();
    var contrasena = pass.value;
    if (!matriculaEscrita) { msg.textContent = "Escribe tu matrícula."; return; }
    if (!contrasena) { msg.textContent = "Escribe tu contraseña."; return; }
    inp.blur();
    pass.blur();
    b.disabled = true;
    bCrear.disabled = true;
    b.textContent = "Verificando...";
    msg.textContent = "";
    // La matrícula y la contraseña se validan en el servidor (validar_acceso).
    iniciarSesion(matriculaEscrita, contrasena).then(function (r) {
      pass.value = ""; // la contraseña no se queda en pantalla ni en memoria
      if (!r || !r.ok) {
        msg.textContent = mensajeAcceso(r || {});
        b.disabled = false;
        bCrear.disabled = false;
        b.textContent = "Entrar";
        return;
      }
      alumno = { matricula: r.matricula, nombre: r.nombre, grupo: r.grupo };
      pantallaInicio();
    }).catch(function () {
      msg.textContent = "No se pudo continuar. Revisa tu conexión e inténtalo de nuevo.";
      b.disabled = false;
      bCrear.disabled = false;
      b.textContent = "Entrar";
    });
  };
  c.appendChild(b);

  // Para el alumno que todavía no tiene contraseña: enlace que lleva a la ventana donde la
  // crea (una sola vez). Después vuelve aquí para entrar con matrícula y contraseña.
  c.appendChild(el("p", "¿Aún no tienes contraseña?", "info"));
  var bCrear = el("button", "Crear contraseña", "enlace");
  bCrear.onclick = function () {
    matriculaEscrita = inp.value.trim();
    pantallaCrearContrasena();
  };
  c.appendChild(bCrear);
  pantalla(c);
}

// Pantalla 1b: crear la contraseña. Solo funciona si la matrícula existe y aún no tiene
// contraseña (el servidor lo comprueba en crear_contrasena). Si el alumno la olvida,
// el profesor la restablece y vuelve a crearla aquí.
function pantallaCrearContrasena() {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Crear contraseña"));
  c.appendChild(el("p", "Elige una contraseña para tu matrícula (mínimo 6 caracteres). Solo puedes crearla una vez; si la olvidas, tu profesor la restablece.", "info"));

  c.appendChild(el("p", "Matrícula", "campo-etq"));
  var inp = el("input");
  inp.type = "text";
  inp.setAttribute("inputmode", "numeric");
  inp.setAttribute("autocomplete", "off");
  inp.value = matriculaEscrita;
  c.appendChild(inp);

  c.appendChild(el("p", "Contraseña", "campo-etq"));
  var pass1 = campoContrasena();
  c.appendChild(pass1);
  c.appendChild(el("p", "Repite la contraseña", "campo-etq"));
  var pass2 = campoContrasena();
  c.appendChild(pass2);

  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", "Guardar contraseña");
  var volver = el("button", "← Volver al acceso", "sec");
  volver.onclick = function () { matriculaEscrita = inp.value.trim(); pantallaLogin(); };
  b.onclick = function () {
    matriculaEscrita = inp.value.trim();
    var p1 = pass1.value, p2 = pass2.value;
    if (!matriculaEscrita) { msg.textContent = "Escribe tu matrícula."; return; }
    if (p1.length < 6) { msg.textContent = "La contraseña debe tener al menos 6 caracteres."; return; }
    if (p1 !== p2) { msg.textContent = "Las contraseñas no coinciden."; return; }
    inp.blur(); pass1.blur(); pass2.blur();
    b.disabled = true;
    volver.disabled = true;
    b.textContent = "Guardando...";
    msg.textContent = "";
    crearContrasena(matriculaEscrita, p1).then(function (r) {
      pass1.value = ""; pass2.value = "";
      if (!r || !r.ok) {
        msg.textContent = mensajeAcceso(r || {});
        b.disabled = false;
        volver.disabled = false;
        b.textContent = "Guardar contraseña";
        return;
      }
      // Contraseña creada y guardada: se regresa al acceso (con la matrícula ya escrita) para
      // que el alumno entre con matrícula y contraseña.
      matriculaEscrita = matriculaEscrita.replace(/\s+/g, "");
      pantallaLogin("Contraseña creada. Ahora entra con tu matrícula y tu contraseña.");
    }).catch(function () {
      msg.textContent = "No se pudo continuar. Revisa tu conexión e inténtalo de nuevo.";
      b.disabled = false;
      volver.disabled = false;
      b.textContent = "Guardar contraseña";
    });
  };
  c.appendChild(b);
  c.appendChild(volver);
  pantalla(c);
}

// Pantalla 2: inicio del alumno. Muestra sus datos (nombre, matrícula, grado, grupo, fecha de hoy).
// En la esquina izquierda hay un botón de menú que abre un panel lateral (hasta la mitad de la
// pantalla) con "Materias" —un botón por cada materia de ESTE alumno— y, hasta abajo, "Cerrar sesión".
function pantallaInicio() {
  var c = el("div", "", "card");

  var barra = el("div", "", "barra");
  var hamb = el("button", "", "hamb");
  hamb.setAttribute("aria-label", "Abrir menú");
  hamb.appendChild(el("span"));
  hamb.appendChild(el("span"));
  hamb.appendChild(el("span"));
  barra.appendChild(hamb);
  barra.appendChild(el("h1", "FullStatus Student"));
  c.appendChild(barra);

  var gg = separarGrupo(alumno.grupo);

  perfil.appendChild(el("p", alumno.nombre, "perfil-nombre"));
  perfil.appendChild(fila("Matrícula", alumno.matricula));
  perfil.appendChild(fila("Grado", gg.grado));
  perfil.appendChild(fila("Grupo", gg.grupo));
  perfil.appendChild(fila("Fecha", fechaHoy()));
  c.appendChild(perfil);
  c.appendChild(el("p", "Toca el botón de arriba a la izquierda para ver tus materias.", "info"));

  // Panel lateral y fondo oscuro (van dentro de la tarjeta pero con posición fija).
  var fondo = el("div");
  fondo.id = "menu-fondo";
  var panel = el("div");
  panel.id = "menu-panel";
  panel.appendChild(el("p", "Materias", "seccion-label"));
  // Zona de materias: primero dice "Cargando" y se llena cuando llega la lista.
  var zona = el("div", "", "menu-zona");
  zona.appendChild(el("p", "Cargando materias...", "info"));
  panel.appendChild(zona);
  var bSalir = el("button", "Cerrar sesión", "sec");
  bSalir.onclick = function () { pantallaLogin(); };
  panel.appendChild(bSalir);
  c.appendChild(fondo);
  c.appendChild(panel);

  function abrirMenu() { fondo.className = "abierto"; panel.className = "abierto"; }
  function cerrarMenu() { fondo.className = ""; panel.className = ""; }
  hamb.onclick = abrirMenu;
  fondo.onclick = cerrarMenu;
  pantalla(c);

  misMaterias(alumno.matricula).then(function (filas) {
    zona.innerHTML = "";
    if (!filas || !filas.length) {
      zona.appendChild(el("p", "Todavía no tienes materias registradas. Pregúntale a tu profesor.", "aviso"));
      return;
    }
    ordenarMaterias(filas).forEach(function (m) {
      var b = el("button", m.nombre, "menu-boton");
      b.onclick = function () { pantallaMateria(m); };
      zona.appendChild(b);
    });
  }).catch(function () {
    zona.innerHTML = "";
    zona.appendChild(el("p", "No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.", "aviso"));
    var r = el("button", "Reintentar");
    r.onclick = pantallaInicio;
    zona.appendChild(r);
  });
}

// Pantalla 3: una materia. Arriba los totales de asistencias, faltas y retardos (se piden cada
// vez que se abre, así siempre reflejan lo último que subió el profesor desde FullStatus) y
// abajo el botón "Exámenes", disponible desde el principio.
function pantallaMateria(m) {
  var c = el("div", "", "card");
  c.appendChild(el("p", "Materia", "seccion-label"));
  c.appendChild(el("h1", m.nombre, "mayus"));

  var zona = el("div");
  zona.appendChild(el("p", "Cargando tus asistencias...", "info"));
  c.appendChild(zona);

  var bEx = el("button", "Exámenes");
  bEx.onclick = function () { pantallaExamenes(m); };
  c.appendChild(bEx);
  var volver = el("button", "← Volver a materias", "sec");
  volver.onclick = pantallaInicio;
  c.appendChild(volver);
  pantalla(c);

  // Se piden a la vez las asistencias y las calificaciones por unidad. Si las calificaciones fallan
  // (o aún no hay), la pantalla sigue funcionando solo con las asistencias.
  Promise.all([
    consultarAsistencias(alumno.matricula),
    misCalificaciones(m.nombre).catch(function () { return []; })
  ]).then(function (res) {
    var a = asistenciaDeMateria(res[0], m.nombre);
    var cals = res[1] || [];
    zona.innerHTML = "";
    if (!a && !cals.length) {
      // Caso normal: el profesor todavía no ha subido asistencias ni calificaciones de este alumno en esta materia.
      zona.appendChild(el("p", "Todavía no hay asistencias registradas para ti en esta materia."));
      return;
    }
    // Se muestra un bloque por UNIDAD, no todas las fechas de la materia. Las unidades y sus fechas
    // las registra el profesor en FullStatus y llegan en a.unidades [{ nombre, desde, hasta }]
    // (fechas "AAAA-MM-DD", que se comparan como texto para que la zona horaria del celular no
    // mueva un día). Una unidad que solo trae calificación (sin fechas) también se muestra.
    var unidades = ((a && a.unidades) || []).map(function (u) {
      return { nombre: u.nombre, desde: String(u.desde || "").slice(0, 10), hasta: String(u.hasta || "").slice(0, 10), conFechas: true };
    });
    cals.forEach(function (c) {
      var ya = unidades.some(function (u) { return clave(u.nombre) === clave(c.unidad); });
      if (!ya) unidades.push({ nombre: c.unidad, conFechas: false });
    });
    if (!unidades.length) {
      zona.appendChild(el("p", "Tu profesor aún no registra las fechas de las unidades de esta materia, por eso todavía no se muestran tus asistencias.", "aviso"));
      return;
    }
    var hayFechas = false;
    unidades.forEach(function (u) {
      var cal = null;
      cals.forEach(function (c) { if (clave(c.unidad) === clave(u.nombre)) cal = c; });
      var bloque = el("div", "", "unidad-bloque");
      bloque.appendChild(el("h2", u.nombre, "mayus"));
      if (cal) bloque.appendChild(tarjetaCalificacion(cal));
      if (u.conFechas) {
        hayFechas = true;
        var detalle = ((a && a.detalle) || []).filter(function (d) {
          var f = String(d.fecha || "").slice(0, 10);
          return f >= u.desde && f <= u.hasta;
        });
        bloque.appendChild(el("p", "Del " + fechaCorta(u.desde) + " al " + fechaCorta(u.hasta) + ".", "info"));
        bloque.appendChild(tarjetaAsistencia(resumenDeDetalle(detalle), true, true));
      }
      zona.appendChild(bloque);
    });
    if (hayFechas) zona.appendChild(el("p", "Cada 3 retardos cuentan como 1 falta. Las faltas justificadas cuentan como asistencia.", "info"));
  }).catch(function () {
    zona.innerHTML = "";
    zona.appendChild(el("p", "No se pudieron cargar tus asistencias. Revisa tu conexión e inténtalo de nuevo.", "aviso"));
  });
}

// ---- Asistencias ----

// Convierte "2026-09-15" en "15/09/2026". Se parte el texto a mano (sin usar Date)
// para que la zona horaria del celular no desplace la fecha un día.
function fechaCorta(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
  return m ? m[3] + "/" + m[2] + "/" + m[1] : String(iso || "");
}

// Texto y color de la etiqueta de cada día según su estado.
// Estados: P = asistencia, R = retardo, A = falta (con "justificada" si la
// perdonó el profesor; una falta justificada cuenta como asistencia).
function etiquetaEstado(d) {
  if (d.estado === "P") return { texto: "Asistencia", clase: "b-p" };
  if (d.estado === "R") return { texto: "Retardo", clase: "b-r" };
  if (d.estado === "A" && d.justificada) return { texto: "Falta justificada", clase: "b-j" };
  return { texto: "Falta", clase: "b-a" };
}

// Un recuadro de la cuadrícula de totales (número grande + etiqueta).
function recuadroTotal(numero, etiqueta, clase) {
  var r = el("div", "", "stat");
  r.appendChild(el("div", String(numero || 0), "stat-num " + clase));
  r.appendChild(el("div", etiqueta, "stat-etq"));
  return r;
}

// Número de puntos sin ceros de más ("2.5", "7"); "—" si no hay dato.
function pts(n) {
  if (n === null || n === undefined) return "—";
  return String(Math.round(Number(n) * 100) / 100);
}

// Calificación de una unidad: total sobre 10, estado y desglose (asistencias, actividades,
// participaciones y examen). Solo lectura: los puntos los calcula FullStatus.
function tarjetaCalificacion(c) {
  var caja = el("div", "", "cal-caja");
  var cab = el("div", "", "cal-cab");
  var izq = el("div");
  izq.appendChild(el("div", pts(c.calificacion) + " / 10", "cal-num"));
  izq.appendChild(el("div", c.completa ? "Calificación de la unidad" : "Lleva " + pts(c.calificacion) + " de 10 (falta el examen)", "cal-etq"));
  cab.appendChild(izq);
  var et = !c.completa ? { t: "En curso", c: "b-g" } : (c.en_remedial ? { t: "En remedial", c: "b-a" } : { t: "Aprobada", c: "b-p" });
  cab.appendChild(el("span", et.t, "badge " + et.c));
  caja.appendChild(cab);
  function fila2(etiqueta, valor) {
    var f = el("div", "", "cal-fila");
    f.appendChild(el("span", etiqueta));
    f.appendChild(el("b", valor));
    return f;
  }
  var hayAct = c.n_actividades !== null && c.n_actividades !== undefined;
  var hayTot = c.total_actividades !== null && c.total_actividades !== undefined;
  caja.appendChild(fila2("Asistencias", pts(c.asistencias)));
  caja.appendChild(fila2("Actividades" + (hayAct ? " (" + c.n_actividades + (hayTot ? " de " + c.total_actividades : "") + ")" : ""), pts(c.actividades)));
  caja.appendChild(fila2("Participaciones" + (c.n_participaciones !== null && c.n_participaciones !== undefined ? " (" + c.n_participaciones + ")" : ""), pts(c.participaciones)));
  caja.appendChild(fila2("Examen", c.examen === null || c.examen === undefined ? "Pendiente" : pts(c.examen)));
  if (c.en_remedial) caja.appendChild(el("p", "Tu calificación quedó por debajo de " + pts(c.minimo) + ": te toca el examen remedial.", "aviso"));
  return caja;
}

// Resumen de asistencias: totales + detalle por fecha (se abre con un botón).
// Los números ya vienen calculados en el servidor; aquí solo se muestran.
// "sinTitulo" = true cuando la pantalla que lo contiene ya dice la materia.
function tarjetaAsistencia(m, sinTitulo, sinNota) {
  var caja = el("div", "", "asist-grupo");
  if (!sinTitulo) {
    caja.appendChild(el("h2", m.materia ? m.materia : "Grupo " + m.grupo));
    if (m.materia) caja.appendChild(el("p", "Grupo " + m.grupo, "info"));
  }

  var totales = el("div", "", "stats");
  totales.appendChild(recuadroTotal(m.asistencias, "Asistencias", "s-p"));
  totales.appendChild(recuadroTotal(m.justificadas, "Justificadas", "s-j"));
  totales.appendChild(recuadroTotal(m.faltas, "Faltas", "s-a"));
  totales.appendChild(recuadroTotal(m.retardos, "Retardos", "s-r"));
  caja.appendChild(totales);

  caja.appendChild(el("p", "Faltas equivalentes: " + (m.faltas_equivalentes || 0), "eq"));
  if (!sinNota) caja.appendChild(el("p", "Cada 3 retardos cuentan como 1 falta. Las faltas justificadas cuentan como asistencia.", "info"));

  var detalle = m.detalle || [];
  var lista = el("div", "", "detalle-lista");
  lista.style.display = "none"; // cerrado al inicio
  detalle.forEach(function (d) {
    var f = el("div", "", "detalle-fila");
    var izq = el("div");
    izq.appendChild(el("div", fechaCorta(d.fecha)));
    if (d.nota) izq.appendChild(el("div", d.nota, "detalle-nota"));
    var et = etiquetaEstado(d);
    f.appendChild(izq);
    f.appendChild(el("span", et.texto, "badge " + et.clase));
    lista.appendChild(f);
  });

  // Se alterna el detalle con un botón dentro de la página (nada de alert/confirm).
  var btn = el("button", "Ver detalle (" + detalle.length + " fechas)", "sec");
  btn.onclick = function () {
    var abierto = lista.style.display !== "none";
    lista.style.display = abierto ? "none" : "block";
    btn.textContent = abierto ? "Ver detalle (" + detalle.length + " fechas)" : "Ocultar detalle";
  };
  caja.appendChild(btn);
  caja.appendChild(lista);
  return caja;
}

// Pantalla 4: exámenes de la materia. Cada uno sale con su estado y solo se puede abrir si el
// profesor se lo asignó al alumno y está dentro de su ventana de fechas (el servidor decide).
function pantallaExamenes(m) {
  var c = el("div", "", "card");
  c.appendChild(el("p", m.nombre, "seccion-label mayus"));
  c.appendChild(el("h1", "Exámenes"));
  var zona = el("div");
  zona.appendChild(el("p", "Cargando exámenes...", "info"));
  c.appendChild(zona);
  var volver = el("button", "← Volver a la materia", "sec");
  volver.onclick = function () { pantallaMateria(m); };
  c.appendChild(volver);
  pantalla(c);

  misExamenes(alumno.matricula, m.nombre).then(function (lista) {
    zona.innerHTML = "";
    if (!lista || !lista.length) {
      zona.appendChild(el("p", "Todavía no hay exámenes para esta materia. Pregúntale a tu profesor.", "aviso"));
      return;
    }
    var unidadPrevia = null;
    lista.forEach(function (ex) {
      // Encabezado "Unidad N" cada vez que cambia la unidad (la lista ya llega ordenada por unidad).
      if (ex.unidad_texto && ex.unidad_texto !== unidadPrevia) {
        var h = el("h2", ex.unidad_texto, "mayus");
        h.style.margin = "18px 0 0";
        zona.appendChild(h);
      }
      unidadPrevia = ex.unidad_texto || null;
      var activo = ex.estado === "disponible" || ex.estado === "en_curso";
      var item = el("div", "", "ex-item" + (activo ? " activo" : ""));
      // Tipo de examen (Ordinario, Remedial, Extraordinario, Extraordinario 2). La lista ya llega
      // en ese orden desde el servidor (mis_examenes).
      if (ex.tipo_texto) item.appendChild(el("div", ex.tipo_texto, "seccion-label"));
      item.appendChild(el("div", ex.nombre, "ex-nombre"));
      item.appendChild(el("p", textoEstadoExamen(ex), "ex-estado"));
      var b = el("button", etiquetaBotonExamen(ex));
      b.disabled = !activo;
      if (activo) b.onclick = function () { confirmarExamen(m, ex); };
      item.appendChild(b);
      zona.appendChild(item);
    });
  }).catch(function () {
    zona.innerHTML = "";
    zona.appendChild(el("p", "No se pudieron cargar los exámenes. Revisa tu conexión e inténtalo de nuevo.", "aviso"));
    var r = el("button", "Reintentar");
    r.onclick = function () { pantallaExamenes(m); };
    zona.appendChild(r);
  });
}

// Texto bajo el nombre del examen según su estado.
function textoEstadoExamen(ex) {
  if (ex.estado === "presentado") return "Presentado: " + ex.correctas + " de " + ex.total + " correctas.";
  if (ex.estado === "en_curso") return "Tienes un intento en curso. Puedes continuarlo.";
  if (ex.estado === "disponible") {
    var cierra = ex.cierra_en ? fechaHora(ex.cierra_en) : "";
    return cierra ? "Disponible hasta el " + cierra + "." : "Disponible.";
  }
  if (ex.estado === "aun_no_abre") {
    var abre = ex.abre_en ? fechaHora(ex.abre_en) : "";
    return abre ? "Abre el " + abre + "." : "Aún no abre.";
  }
  if (ex.estado === "cerrado") return "Este examen ya cerró.";
  if (ex.estado === "sin_examen") return "Aún no hay examen para esta unidad.";
  if (ex.estado === "no_asignado") return "Tu profesor aún no te lo ha asignado.";
  return "No disponible por ahora.";
}
function etiquetaBotonExamen(ex) {
  if (ex.estado === "disponible") return "Comenzar";
  if (ex.estado === "en_curso") return "Continuar examen";
  if (ex.estado === "presentado") return "Presentado";
  return "No disponible";
}

// Examen, paso 1: avisos y botón "Comenzar examen". Es el punto donde empieza
// la vigilancia anti-trampa (Android.iniciarExamen), igual que antes.
// "m" = materia { nombre }, "ex" = examen { id, nombre, estado, ... }.
function confirmarExamen(m, ex) {
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Examen"));
  c.appendChild(el("p", ex.nombre, "seccion-label mayus"));
  c.appendChild(el("p", "Tendrás un tiempo límite para contestar; verás el reloj arriba. Al terminar el tiempo, el examen se entrega solo con lo que lleves.", "aviso"));
  c.appendChild(el("p", "Al comenzar no podrás salir, minimizar, cambiar de pantalla ni tomar capturas. Si lo haces, el examen se cierra. Podrás reanudarlo hasta " + (ex.max_reanudaciones || 2) + " veces, sin perder el tiempo que ya corrió; después se anula.", "aviso"));
  if (ex.estado === "en_curso") {
    c.appendChild(el("p", "Ya tienes un intento en curso. Al continuar recuperarás las respuestas que habías guardado.", "info"));
  }
  var msg = el("p", "", "aviso");
  c.appendChild(msg);
  var b = el("button", ex.estado === "en_curso" ? "Continuar examen" : "Comenzar examen");
  var volver = el("button", "← Volver", "sec");
  volver.onclick = function () { pantallaExamenes(m); };
  b.onclick = function () {
    b.disabled = true;
    volver.disabled = true;
    b.textContent = "Cargando preguntas...";
    msg.textContent = "";
    var info = null;
    // 1) El servidor abre (o reanuda) el intento y dice cuánto tiempo queda.
    iniciarIntento(ex.id).then(function (r) {
      if (r.estado === "usado") throw errorMostrable("Ya presentaste este examen.");
      if (r.estado === "agotado") throw errorMostrable("Se acabó el tiempo de tu intento. Se calificó el avance que habías guardado.");
      if (r.estado === "anulado") throw errorMostrable("Tu examen se anuló por salir de la app demasiadas veces.");
      info = r;
      // 2) Se piden las preguntas (sin respuestas correctas).
      return obtenerPreguntas(ex.id);
    }).then(function (preguntas) {
      if (!preguntas.length) throw errorMostrable("Este examen todavía no tiene preguntas disponibles.");
      examenId = ex.id;
      PREGUNTAS = preguntas;
      SECCIONES = agruparSecciones(preguntas);
      // -1 = sin responder. Se recuperan las respuestas guardadas si el alumno está reanudando.
      resp = PREGUNTAS.map(function () { return -1; });
      var parciales = info.respuestas_parciales || [];
      for (var i = 0; i < parciales.length && i < resp.length; i++) {
        if (typeof parciales[i] === "number") resp[i] = parciales[i];
      }
      setTimeout(function () {
        if (window.Android) Android.iniciarExamen();
        secIdx = 0;
        examenTerminado = false;
        avisoFaltantes = false;
        iniciarReloj(info.restante_seg);
        pantallaSeccion();
      }, 300);
    }).catch(function (e) {
      msg.textContent = e && e.mostrar ? e.message : mensajeErrorServidor(e);
      b.disabled = false;
      volver.disabled = false;
      b.textContent = ex.estado === "en_curso" ? "Continuar examen" : "Comenzar examen";
    });
  };
  c.appendChild(b);
  c.appendChild(volver);
  pantalla(c);
}

// Error con un texto ya listo para mostrar al alumno (se distingue de los errores del servidor).
function errorMostrable(texto) {
  var e = new Error(texto);
  e.mostrar = true;
  return e;
}

// Agrupa las preguntas (ya ordenadas) en secciones: cada vez que cambia el texto de "seccion"
// respecto a la pregunta anterior empieza un grupo nuevo. Las preguntas sin sección que van
// seguidas forman un solo grupo sin título. Cada grupo guarda los ÍNDICES de sus preguntas
// (así resp[] sigue siendo plano y alineado con el orden en que califica el servidor).
function agruparSecciones(preguntas) {
  var grupos = [];
  preguntas.forEach(function (p, i) {
    var ultimo = grupos[grupos.length - 1];
    if (ultimo && ultimo.nombre === p.s) ultimo.indices.push(i);
    else grupos.push({ nombre: p.s, indices: [i] });
  });
  return grupos;
}

// Arma el bloque de "contexto" que va arriba de una pregunta (si trae uno):
// video de YouTube si se detecta un link, o un bloque de texto plano si no
// (instrucciones, pasaje de lectura, etc.).
//
// Regresa { nodo, iniciar }: "nodo" es lo que se agrega a la pantalla; "iniciar"
// (solo en videos) se llama DESPUÉS de que el nodo ya está en el documento, porque
// la API de YouTube necesita encontrar el contenedor en pantalla para reemplazarlo
// por el reproductor.
function bloqueContexto(p) {
  if (!p.x) return null;
  var idVideo = extraerIdYoutube(p.x);
  if (idVideo) {
    var caja = el("div");
    var envoltorio = el("div", "", "video-envoltorio");
    var destino = el("div");
    destino.id = "yt-destino-" + (++ytContador);
    envoltorio.appendChild(destino);
    var aviso = el("p", "", "video-aviso");
    caja.appendChild(envoltorio);
    caja.appendChild(aviso);
    return { nodo: caja, iniciar: function () { crearReproductor(destino.id, idVideo, aviso); } };
  }
  return { nodo: el("div", p.x, "contexto-texto"), iniciar: null };
}

// Cuenta cuántas preguntas siguen sin responder.
function contarSinResponder() {
  return resp.filter(function (r) { return r < 0; }).length;
}

// Guarda el avance en el servidor poco después del último cambio (se agrupan varios toques en
// un solo envío). Si falla (sin internet) no pasa nada: se vuelve a mandar con la siguiente
// respuesta y, al terminar, calificar_examen manda todo.
function programarGuardado() {
  if (examenTerminado) return;
  if (guardarTimer) clearTimeout(guardarTimer);
  guardarTimer = setTimeout(function () {
    guardarTimer = null;
    if (examenTerminado) return;
    guardarProgreso(examenId, resp.slice()).catch(function () { /* se reintenta con el siguiente cambio */ });
  }, 1500);
}

// Muestra UNA sección completa: todas sus preguntas en la misma pantalla.
// El contexto (video/texto) se muestra solo cuando cambia respecto a la
// pregunta anterior de la sección; si 10 preguntas comparten un mismo video o
// pasaje, aparece una vez arriba de ellas y no 10 veces.
function pantallaSeccion() {
  var g = SECCIONES[secIdx];
  var esUltima = secIdx + 1 >= SECCIONES.length;
  var c = el("div", "", "card");
  c.appendChild(el("p", "Sección " + (secIdx + 1) + " de " + SECCIONES.length + " · " + g.indices.length + " pregunta(s)"));
  if (g.nombre) c.appendChild(el("p", g.nombre, "seccion-label"));

  var iniciadores = [];   // funciones que arrancan los videos cuando la tarjeta ya está en pantalla
  var contextoPrevio = null;

  g.indices.forEach(function (qi) {
    var p = PREGUNTAS[qi];
    var bloque = el("div", "", "pregunta-bloque");
    if (p.x && p.x !== contextoPrevio) {
      var ctx = bloqueContexto(p);
      bloque.appendChild(ctx.nodo);
      if (ctx.iniciar) iniciadores.push(ctx.iniciar);
    }
    contextoPrevio = p.x || null;

    bloque.appendChild(el("h2", (qi + 1) + ". " + p.t));
    p.o.forEach(function (txt, i) {
      var b = el("button", String.fromCharCode(65 + i) + ") " + txt, "op" + (resp[qi] === i ? " sel" : ""));
      b.onclick = function () {
        resp[qi] = i;
        // Solo se repintan las opciones de ESTA pregunta (no se vuelve a dibujar
        // la pantalla, para no reiniciar los videos).
        var hermanas = bloque.querySelectorAll(".op");
        for (var k = 0; k < hermanas.length; k++) hermanas[k].className = "op" + (k === i ? " sel" : "");
        programarGuardado();
      };
      bloque.appendChild(b);
    });
    c.appendChild(bloque);
  });

  var msg = el("p", avisoFaltantes && esUltima ? "Te faltan " + contarSinResponder() + " pregunta(s) sin responder. Revisa las secciones anteriores o toca de nuevo para terminar." : "", "aviso");
  c.appendChild(msg);

  if (secIdx > 0) {
    var ant = el("button", "← Sección anterior", "sec");
    ant.onclick = function () { secIdx--; pantallaSeccion(); };
    c.appendChild(ant);
  }
  var sig = el("button", esUltima ? (avisoFaltantes ? "Terminar de todos modos" : "Terminar examen") : "Siguiente sección →");
  sig.onclick = function () {
    if (!esUltima) { secIdx++; pantallaSeccion(); return; }
    // Última sección: si faltan respuestas se avisa UNA vez (sin confirm(), que
    // en el WebView no funciona y además robaría el foco y anularía el examen).
    var faltan = contarSinResponder();
    if (faltan > 0 && !avisoFaltantes) {
      avisoFaltantes = true;
      msg.textContent = "Te faltan " + faltan + " pregunta(s) sin responder. Revisa las secciones anteriores o toca de nuevo para terminar.";
      sig.textContent = "Terminar de todos modos";
      return;
    }
    fin(false);
  };
  c.appendChild(sig);
  pantalla(c);
  // Los reproductores se crean hasta que la tarjeta ya está en pantalla (ver bloqueContexto).
  iniciadores.forEach(function (f) { f(); });
}

// Termina el examen (por botón o por fin del tiempo) y manda a calificar.
// "porTiempo" solo cambia el texto que ve el alumno.
function fin(porTiempo) {
  if (examenTerminado) return; // ya se está calificando
  examenTerminado = true;
  if (guardarTimer) { clearTimeout(guardarTimer); guardarTimer = null; }
  detenerReloj();
  if (window.Android) Android.terminarExamen();
  var c = el("div", "", "card");
  c.appendChild(el("h1", "Calificando..."));
  if (porTiempo) c.appendChild(el("p", "Se acabó el tiempo. Se entregan las respuestas que llevabas.", "aviso"));
  c.appendChild(el("p", "Espera un momento."));
  pantalla(c);
  intentarCalificar();
}

// Pantalla final con un solo botón "Salir" (cierra la app y la quita de Recientes).
function pantallaFinal(titulo, texto, clase) {
  var c = el("div", "", "card");
  c.appendChild(el("h1", titulo));
  c.appendChild(el("p", texto, clase));
  var b = el("button", "Salir");
  b.onclick = function () { if (window.Android) Android.salir(); else pantallaInicio(); };
  c.appendChild(b);
  pantalla(c);
}

function intentarCalificar() {
  calificarExamen(examenId, resp).then(function (resultado) {
    pantallaFinal("Examen terminado", alumno.nombre + ": " + resultado.correctas + " de " + resultado.total + " correctas");
  }).catch(function (e) {
    var t = String((e && e.message) || "");
    // El servidor ya cerró el examen por su cuenta: no tiene caso reintentar.
    if (/Tiempo agotado/i.test(t)) {
      pantallaFinal("Se acabó el tiempo", "El tiempo terminó antes de que llegara tu entrega. Se calificó el avance que tenías guardado; consulta tu resultado con tu profesor.", "aviso");
      return;
    }
    if (/Intento ya utilizado/i.test(t)) {
      pantallaFinal("Examen ya enviado", "Este examen ya había sido enviado y calificado.", "aviso");
      return;
    }
    var c = el("div", "", "card");
    c.appendChild(el("h1", "No se pudo calificar"));
    c.appendChild(el("p", /firma|reloj|desajust/i.test(t) ? mensajeErrorServidor(e) : "Revisa tu conexión e inténtalo de nuevo. Tus respuestas no se han perdido.", "aviso"));
    var b = el("button", "Reintentar");
    b.onclick = intentarCalificar;
    c.appendChild(b);
    pantalla(c);
  });
}

pantallaLogin();
</script>
