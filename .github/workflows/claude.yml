#
# Permite mencionar @claude en un issue o en un comentario de pull request para que Claude Code
# lea el repo, haga cambios y los suba como rama / commits / PR (no escribe directo en main
# salvo que tú lo pidas y las reglas de la rama lo permitan).
#
# Requisitos (se hacen una sola vez, en GitHub):
#   1. La GitHub App "Claude" instalada en este repo (ya lo está).
#   2. Secreto ANTHROPIC_API_KEY en Settings > Secrets and variables > Actions.
#   3. Este archivo en .github/workflows/ (es un archivo APARTE de build.yml a propósito:
#      la regla 8 del README prohíbe que build.yml haga commit/push al repo).
#
# Seguridad:
#   - Solo reacciona a comentarios que contengan "@claude".
#   - Los permisos están limitados a lo mínimo para leer código y abrir ramas/PR.
#   - La clave de Anthropic llega SOLO por el secreto; nunca se escribe en el repo.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Corre solo si el comentario menciona a @claude.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # leer el código y subir ramas/commits
      pull-requests: write   # abrir y comentar pull requests
      issues: write          # responder en issues
      actions: read          # leer resultados de CI (p. ej. si falla build.yml)
      id-token: write        # la action lo usa para autenticarse con la GitHub App
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
